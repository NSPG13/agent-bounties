# Production replacement services only. Existing secrets and environment values
# remain managed directly in Render; omitted env vars are preserved on sync.
# Keep exs-d97too57vvec73ctvmh0 paused until an adoption plan maps these names
# to the exact IDs in ops/public-runtime-services.json with no new resources.
# Never resume or recreate the retired API/readers or security-held protocols.
services:
  - type: web
    name: agentizable-api-recovery-20261109
    runtime: docker
    branch: main
    # The API-only GitHub controller deploys exact main after CI and Containers.
    autoDeployTrigger: 'off'
    dockerfilePath: ./Dockerfile.recovery-api
    dockerContext: .
    preDeployCommand: /usr/local/bin/check-recovery-revision --built-revision
    healthCheckPath: /health

  - type: worker
    name: agentizable-readers-recovery-20261110
    runtime: docker
    branch: main
    # A healthy reader can unblock overdue financial processing. Enable native
    # CI-triggered deploys only after the separate financial containment review.
    autoDeployTrigger: 'off'
    dockerfilePath: ./Dockerfile.recovery-indexers
    dockerContext: .
    preDeployCommand: /usr/local/bin/check-recovery-revision --built-revision
