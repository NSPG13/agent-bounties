[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskmarket-adapter"
version = "0.2.0"
description = "Security-focused MCP adapter for the first-party Taskmarket CLI"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
taskmarket-mcp = "taskmarket_adapter.server:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
