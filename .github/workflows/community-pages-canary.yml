name: Public Site Canary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Prepare pinned browser
        working-directory: tools/browser-layout
        run: |
          npm ci --ignore-scripts --no-fund
          npx playwright install --with-deps chromium
      - name: Verify production revisions, discovery, input contracts and assets
        run: |
          mkdir -p proof
          python3 scripts/verify-ux-production-contracts.py --expected-runtime-revision bf9d09fe738c89e5c0354c4a435c81f36c298d43 --website-source . --output proof/contracts.json
          cat proof/contracts.json
      - name: Verify the original production round in real browsers
        run: node scripts/verify-ux-production-browser.cjs
      - name: Preserve public verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ux-production-proof
          path: proof
          retention-days: 7
