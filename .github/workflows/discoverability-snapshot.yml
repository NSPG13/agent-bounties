name: Discoverability snapshot

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Collect and validate available providers without uploading snapshots
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: discoverability-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      PRODUCTION_API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL || 'https://api.agentizable.ai' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install read-only provider clients
        run: python -m pip install --disable-pip-version-check --no-input google-auth==2.40.3 requests==2.32.4

      - name: Validate collector
        run: python -m unittest scripts/test_discoverability_snapshot.py

      - name: Authenticate Search Console with keyless identity
        id: google_auth
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' || vars.GCP_SEARCH_CONSOLE_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SEARCH_CONSOLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
          create_credentials_file: false
          export_environment_variables: false

      - name: Snapshot overlapping provider windows
        env:
          GSC_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          REPOSITORY_TRAFFIC_TOKEN: ${{ secrets.REPOSITORY_TRAFFIC_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          DISCOVERABILITY_INGEST_TOKEN: ${{ secrets.DISCOVERABILITY_INGEST_TOKEN }}
          DISCOVERABILITY_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=()
          if [ "$DISCOVERABILITY_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/discoverability_snapshot.py "${args[@]}"
