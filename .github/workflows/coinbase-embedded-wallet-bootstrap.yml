name: Diagnose Coinbase embedded-wallet lock

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/coinbase-embedded-wallet-bootstrap.yml"
      - "tools/coinbase-embedded-wallet/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: coinbase-wallet-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/coinbase-embedded-wallet

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/coinbase-embedded-wallet/package-lock.json

      - name: Reproduce exact lockfile
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci --prefix tools/coinbase-embedded-wallet --ignore-scripts --no-audit --no-fund --loglevel verbose 2>&1 | tee /tmp/coinbase-npm-ci.log

      - name: Publish exact lock result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            if [[ "${{ steps.install.outcome }}" == "success" ]]; then
              echo '✅ **Coinbase embedded-wallet lock reproduced with `npm ci`.**'
            else
              echo '❌ **Coinbase embedded-wallet lock reproduction failed.**'
            fi
            echo
            echo '```text'
            tail -n 160 /tmp/coinbase-npm-ci.log
            echo '```'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/coinbase-lock-result.md
          gh pr comment 605 --repo "$GITHUB_REPOSITORY" --body-file /tmp/coinbase-lock-result.md

      - name: Enforce reproducible lock
        if: steps.install.outcome == 'failure'
        run: exit 1
