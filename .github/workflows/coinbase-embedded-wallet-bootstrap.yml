name: Regenerate Coinbase embedded-wallet lock

on:
  push:
    branches:
      - maintainer/coinbase-embedded-wallet
    paths:
      - ".github/workflows/coinbase-embedded-wallet-bootstrap.yml"
      - "tools/coinbase-embedded-wallet/package.json"
      - "tools/coinbase-embedded-wallet/package-lock.json"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/coinbase-embedded-wallet-bootstrap.yml"
      - "tools/coinbase-embedded-wallet/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: coinbase-wallet-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: maintainer/coinbase-embedded-wallet

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/coinbase-embedded-wallet/package-lock.json

      - name: Regenerate lockfile from exact direct pins
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tools/coinbase-embedded-wallet --ignore-scripts --no-audit --no-fund

      - name: Prove clean lockfile reproduction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/coinbase-embedded-wallet/node_modules
          npm ci --prefix tools/coinbase-embedded-wallet --ignore-scripts --no-audit --no-fund
          npm ls --prefix tools/coinbase-embedded-wallet --all

      - name: Prepare reviewed esbuild binary
        run: npm rebuild --prefix tools/coinbase-embedded-wallet esbuild

      - name: Rebuild and test the adapter
        shell: bash
        run: |
          set -euo pipefail
          npm run check --prefix tools/coinbase-embedded-wallet
          npm run build --prefix tools/coinbase-embedded-wallet
          python scripts/check-coinbase-embedded-wallet.py
          python scripts/check-site.py
          node scripts/test-wallet-adapter-registry.js
          node scripts/test-x402-browser.js

      - name: Audit complete locked dependency graph
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm audit --prefix tools/coinbase-embedded-wallet --json > /tmp/coinbase-npm-audit.json

      - name: Upload bounded audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coinbase-embedded-wallet-audit-${{ github.run_id }}
          path: /tmp/coinbase-npm-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload generated lock and browser bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coinbase-embedded-wallet-generated-${{ github.run_id }}
          path: |
            tools/coinbase-embedded-wallet/package-lock.json
            site/coinbase-embedded-wallet.bundle.js
            site/coinbase-embedded-wallet.bundle.css
          if-no-files-found: error
          retention-days: 7

      - name: Publish bounded audit result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path('/tmp/coinbase-npm-audit.json')
          try:
              report = json.loads(source.read_text(encoding='utf-8')) if source.exists() else {}
          except Exception as error:
              report = {'error': f'invalid npm audit JSON: {error}'}
          metadata = report.get('metadata') or {}
          totals = metadata.get('vulnerabilities') or {}
          vulnerabilities = report.get('vulnerabilities') or {}
          lines = [
              '## Coinbase embedded-wallet regenerated lock audit',
              '',
              f"Outcome: `{os.environ.get('AUDIT_OUTCOME', 'unknown')}`",
              f"Totals: `{json.dumps(totals, sort_keys=True)}`",
              '',
          ]
          if report.get('error'):
              lines.append(f"Audit error: `{report['error']}`")
          elif not vulnerabilities:
              lines.append('No npm advisory is present in the complete locked dependency graph.')
          else:
              for name in sorted(vulnerabilities):
                  item = vulnerabilities[name] or {}
                  via = []
                  for entry in item.get('via') or []:
                      if isinstance(entry, str):
                          via.append(entry)
                      elif isinstance(entry, dict):
                          via.append(str(entry.get('title') or entry.get('name') or entry.get('url') or 'advisory'))
                  lines.extend([
                      f"- **{name}** — severity `{item.get('severity')}`; direct `{item.get('isDirect')}`; range `{item.get('range')}`; fix `{json.dumps(item.get('fixAvailable'))}`",
                      f"  - via: {', '.join(via[:8]) or 'not supplied'}",
                      f"  - effects: {', '.join(item.get('effects') or []) or 'none supplied'}",
                  ])
          Path('/tmp/coinbase-audit-comment.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          gh pr comment 605 --repo "$GITHUB_REPOSITORY" --body-file /tmp/coinbase-audit-comment.md

      - name: Enforce clean advisory graph
        if: steps.audit.outcome == 'failure'
        run: exit 1

      - name: Commit regenerated lock and reproducible bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/coinbase-embedded-wallet/package-lock.json \
            site/coinbase-embedded-wallet.bundle.js \
            site/coinbase-embedded-wallet.bundle.css
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "The lock and bundle were already current."
            exit 0
          fi
          git commit -m "[coinbase-lock] Regenerate reproducible embedded-wallet lock"
          git push origin HEAD:maintainer/coinbase-embedded-wallet
