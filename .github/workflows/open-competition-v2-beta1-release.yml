name: Open Competition V2 Beta1 release

on:
  pull_request:
    paths:
      - ".github/workflows/open-competition-v2-beta1-release.yml"
      - "contracts/base-escrow/src/OpenCompetitionBountyV2Beta1.sol"
      - "contracts/base-escrow/src/OpenCompetitionBountyFactoryV2Beta1.sol"
      - "contracts/base-escrow/src/Sp1VerifierAdapterV2Beta1.sol"
      - "contracts/base-escrow/test/OpenCompetitionBountyV2Beta1.t.sol"
      - "crates/competition-metric-*/**"
      - "programs/public-vector-metric-v1/**"
      - "deployments/open-competition-v2-beta1-release-gates.json"
      - "scripts/*open_competition_v2*"
      - "docs/open-competition-v2-beta1*"
  workflow_dispatch:
    inputs:
      run_real_proof_fork_rehearsal:
        description: Generate Groth16 and PLONK proofs and replay every V2 path on a Base mainnet fork
        type: boolean
        required: true
        default: false
      run_live_sepolia_rehearsal:
        description: Deploy the exact Beta1 factory and run both proof systems, pooled funding, expiry, and refunds on Base Sepolia
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: open-competition-v2-beta1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install exact release helper dependencies
        run: python -m pip install -r scripts/requirements-wallet.txt
      - name: Contract and release-tooling gates
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          forge build --root contracts/base-escrow --force --ast
          forge test --root contracts/base-escrow \
            --match-contract '(OpenCompetitionBountyV2Beta1Test|OpenCompetitionBountyV2Beta1InvariantTest)' \
            --fuzz-runs 10000 -vv
          python -m unittest \
            scripts.test_build_open_competition_v2_beta1_release \
            scripts.test_check_open_competition_v2_prover_backend \
            scripts.test_prepare_open_competition_v2_metric_fixture \
            scripts.test_run_open_competition_v2_mainnet_fork_replay \
            scripts.test_open_competition_v2_proof_rehearsal \
            scripts.test_run_open_competition_v2_sepolia_rehearsal -v
      - name: Build safe-block release plans
        env:
          BASE_MAINNET_RPC_URL: ${{ vars.BASE_MAINNET_ARCHIVE_RPC_URL || 'https://mainnet.base.org' }}
          BASE_SEPOLIA_RPC_URL: ${{ vars.BASE_SEPOLIA_RPC_URL || 'https://sepolia.base.org' }}
        run: |
          set -euo pipefail
          python scripts/build_open_competition_v2_beta1_release.py \
            --network base-mainnet --rpc-url "$BASE_MAINNET_RPC_URL" \
            --source-commit "$GITHUB_SHA" \
            --output target/open-competition-v2-mainnet-plan.json
          python scripts/build_open_competition_v2_beta1_release.py \
            --network base-sepolia --rpc-url "$BASE_SEPOLIA_RPC_URL" \
            --source-commit "$GITHUB_SHA" \
            --output target/open-competition-v2-sepolia-plan.json
      - name: Replay exact mainnet deployment transaction
        env:
          BASE_MAINNET_RPC_URL: ${{ vars.BASE_MAINNET_ARCHIVE_RPC_URL || 'https://mainnet.base.org' }}
        run: >-
          python scripts/run_open_competition_v2_mainnet_fork_replay.py
          --bundle target/open-competition-v2-mainnet-plan.json
          --rpc-url "$BASE_MAINNET_RPC_URL"
          --output target/open-competition-v2-mainnet-fork-replay.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: open-competition-v2-beta1-release-plan-${{ github.sha }}
          path: |
            target/open-competition-v2-*-plan.json
            target/open-competition-v2-mainnet-fork-replay.json
          if-no-files-found: error
          retention-days: 90

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Run pinned Slither and enforce triage fingerprint
        run: |
          set -euo pipefail
          python -m pip install slither-analyzer==0.11.5
          mkdir -p target
          set +e
          slither contracts/base-escrow/src/OpenCompetitionBountyFactoryV2Beta1.sol \
            --json target/open-competition-v2-beta1-slither.json \
            > target/open-competition-v2-beta1-slither.txt 2>&1
          SLITHER_STATUS=$?
          set -e
          test -s target/open-competition-v2-beta1-slither.json || {
            cat target/open-competition-v2-beta1-slither.txt
            exit "$SLITHER_STATUS"
          }
          python scripts/verify_open_competition_v2_slither.py \
            --report target/open-competition-v2-beta1-slither.json \
            --output target/open-competition-v2-beta1-slither-triage.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: open-competition-v2-beta1-slither-${{ github.sha }}
          path: target/open-competition-v2-beta1-slither*
          if-no-files-found: error
          retention-days: 90

  build-proof-runner:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.run_real_proof_fork_rehearsal || inputs.run_live_sepolia_rehearsal))
    needs: deterministic-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: dtolnay/rust-toolchain@858a1ecb106d4516018578006590eb829de1f08e
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          version: "28.3"
      - name: Install checksum-pinned SP1 6.3.1 toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://sp1.succinct.xyz -o /tmp/sp1up-install.sh
          echo "5f2b976287501d3f5feb62a2a96bbdfd1f5232c9badaf7547ed837c0366f3a7b  /tmp/sp1up-install.sh" | sha256sum -c -
          bash /tmp/sp1up-install.sh
          "$HOME/.sp1/bin/sp1up" -v 6.3.1
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - name: Build one exact prover runner
        working-directory: programs/public-vector-metric-v1
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/sp1-public-vector
          CARGO_BUILD_JOBS: "4"
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "1.96.1"
          cargo build --locked --release -p public-vector-metric-v1-script --features network
          mkdir -p "$GITHUB_WORKSPACE/target/open-competition-v2-prover-runner"
          install -m 0755 \
            "$CARGO_TARGET_DIR/release/public-vector-metric-v1-script" \
            "$GITHUB_WORKSPACE/target/open-competition-v2-prover-runner/public-vector-metric-v1-script"
          cd "$GITHUB_WORKSPACE/target/open-competition-v2-prover-runner"
          ./public-vector-metric-v1-script --capabilities | tee capabilities.json
          python -c 'import json; value=json.load(open("capabilities.json")); assert value["backends"] == ["cpu", "network"]'
          sha256sum public-vector-metric-v1-script > public-vector-metric-v1-script.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: open-competition-v2-beta1-prover-runner-${{ github.sha }}
          path: target/open-competition-v2-prover-runner
          if-no-files-found: error
          retention-days: 90

  prepare-real-proof-fork:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.run_real_proof_fork_rehearsal || inputs.run_live_sepolia_rehearsal))
    needs: deterministic-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install release helper dependencies
        run: python -m pip install -r scripts/requirements-wallet.txt
      - name: Build exact bundle and prepare bound proof fixtures
        env:
          BASE_MAINNET_RPC_URL: ${{ vars.BASE_MAINNET_ARCHIVE_RPC_URL || 'https://mainnet.base.org' }}
        run: |
          set -euo pipefail
          forge build --root contracts/base-escrow --force --ast
          python scripts/build_open_competition_v2_beta1_release.py \
            --network base-mainnet --rpc-url "$BASE_MAINNET_RPC_URL" \
            --source-commit "$GITHUB_SHA" \
            --output target/open-competition-v2-mainnet-plan.json
          python scripts/run_open_competition_v2_mainnet_fork_replay.py \
            --bundle target/open-competition-v2-mainnet-plan.json \
            --rpc-url "$BASE_MAINNET_RPC_URL" \
            --prepare-proof-fixtures target/open-competition-v2-proof-prepared \
            --output target/open-competition-v2-mainnet-proof-preparation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: open-competition-v2-beta1-real-proof-inputs-${{ github.sha }}
          path: |
            target/open-competition-v2-mainnet-plan.json
            target/open-competition-v2-mainnet-proof-preparation.json
            target/open-competition-v2-mainnet-proof-preparation.anvil.log
            target/open-competition-v2-proof-prepared/*.json
          if-no-files-found: error
          retention-days: 90

  generate-real-groth16-proof:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.run_real_proof_fork_rehearsal || inputs.run_live_sepolia_rehearsal))
    needs: [prepare-real-proof-fork, build-proof-runner]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: open-competition-v2-beta1-real-proof-inputs-${{ github.sha }}
          path: target
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: open-competition-v2-beta1-prover-runner-${{ github.sha }}
          path: target/open-competition-v2-prover-runner
      - name: Verify exact runner and install helper dependencies
        run: |
          set -euo pipefail
          python -m pip install -r scripts/requirements-wallet.txt
          cd target/open-competition-v2-prover-runner
          sha256sum -c public-vector-metric-v1-script.sha256
          chmod 0755 public-vector-metric-v1-script
      - name: Configure bounded proof memory
        run: |
          set -euo pipefail
          sudo fallocate -l 12G /mnt/open-competition-v2.swap
          sudo chmod 0600 /mnt/open-competition-v2.swap
          sudo mkswap /mnt/open-competition-v2.swap
          sudo swapon /mnt/open-competition-v2.swap
          free -h
      - name: Generate and self-verify one exact proof
        env:
          OPEN_COMPETITION_V2_PROVER_BINARY: ${{ github.workspace }}/target/open-competition-v2-prover-runner/public-vector-metric-v1-script
          RAYON_NUM_THREADS: "2"
          SP1_PROVER: cpu
        run: >-
          python scripts/generate_open_competition_v2_proof.py
          --bundle target/open-competition-v2-mainnet-plan.json
          --prepared-dir target/open-competition-v2-proof-prepared
          --proof-name groth16_first
          --output target/open-competition-v2-proof-evidence/groth16_first.json
          --log-dir target/open-competition-v2-proof-logs/groth16_first
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: open-competition-v2-beta1-proof-groth16_first-${{ github.sha }}
          path: |
            target/open-competition-v2-proof-evidence/groth16_first.json
            target/open-competition-v2-proof-logs/groth16_first/*.log
          if-no-files-found: error
          retention-days: 90

  verify-plonk-backend:
    if: github.event_name == 'workflow_dispatch' && (inputs.run_real_proof_fork_rehearsal || inputs.run_live_sepolia_rehearsal)
    needs: build-proof-runner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: open-competition-v2-beta1-prover-runner-${{ github.sha }}
          path: target/open-competition-v2-prover-runner
      - name: Verify network-capable PLONK backend
        env:
          NETWORK_PRIVATE_KEY: ${{ secrets.SP1_NETWORK_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          chmod 0755 target/open-competition-v2-prover-runner/public-vector-metric-v1-script
          python scripts/check_open_competition_v2_prover_backend.py \
            --proof-system plonk --backend network \
            --runner target/open-competition-v2-prover-runner/public-vector-metric-v1-script \
            --output target/open-competition-v2-plonk-backend-readiness.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: open-competition-v2-beta1-plonk-backend-readiness-${{ github.sha }}
          path: target/open-competition-v2-plonk-backend-readiness.json
          if-no-files-found: error
          retention-days: 90

  generate-real-plonk-proof:
    if: github.event_name == 'workflow_dispatch' && (inputs.run_real_proof_fork_rehearsal || inputs.run_live_sepolia_rehearsal)
    needs: [prepare-real-proof-fork, build-proof-runner, verify-plonk-backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        proof: [plonk_best_a, plonk_best_b]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: open-competition-v2-beta1-real-proof-inputs-${{ github.sha }}
          path: target
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: open-competition-v2-beta1-prover-runner-${{ github.sha }}
          path: target/open-competition-v2-prover-runner
      - name: Verify exact runner and install helper dependencies
        run: |
          set -euo pipefail
          python -m pip install -r scripts/requirements-wallet.txt
          cd target/open-competition-v2-prover-runner
          sha256sum -c public-vector-metric-v1-script.sha256
          chmod 0755 public-vector-metric-v1-script
      - name: Generate and self-verify one network PLONK proof
        env:
          NETWORK_PRIVATE_KEY: ${{ secrets.SP1_NETWORK_PRIVATE_KEY }}
          OPEN_COMPETITION_V2_PROVER_BINARY: ${{ github.workspace }}/target/open-competition-v2-prover-runner/public-vector-metric-v1-script
          SP1_PROVER: network
        run: >-
          python scripts/generate_open_competition_v2_proof.py
          --bundle target/open-competition-v2-mainnet-plan.json
          --prepared-dir target/open-competition-v2-proof-prepared
          --proof-name "${{ matrix.proof }}"
          --output "target/open-competition-v2-proof-evidence/${{ matrix.proof }}.json"
          --log-dir "target/open-competition-v2-proof-logs/${{ matrix.proof }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: open-competition-v2-beta1-proof-${{ matrix.proof }}-${{ github.sha }}
          path: |
            target/open-competition-v2-proof-evidence/${{ matrix.proof }}.json
            target/open-competition-v2-proof-logs/${{ matrix.proof }}/*.log
          if-no-files-found: error
          retention-days: 90

  real-proof-fork-rehearsal:
    if: github.event_name == 'workflow_dispatch' && (inputs.run_real_proof_fork_rehearsal || inputs.run_live_sepolia_rehearsal)
    needs: [prepare-real-proof-fork, generate-real-groth16-proof, generate-real-plonk-proof]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: open-competition-v2-beta1-real-proof-inputs-${{ github.sha }}
          path: target
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: open-competition-v2-beta1-proof-*-${{ github.sha }}
          path: target
          merge-multiple: true
      - name: Install replay dependencies
        run: python -m pip install -r scripts/requirements-wallet.txt
      - name: Validate proofs and replay every transaction path
        env:
          BASE_MAINNET_RPC_URL: ${{ vars.BASE_MAINNET_ARCHIVE_RPC_URL || 'https://mainnet.base.org' }}
        run: >-
          python scripts/run_open_competition_v2_mainnet_fork_replay.py
          --bundle target/open-competition-v2-mainnet-plan.json
          --rpc-url "$BASE_MAINNET_RPC_URL"
          --proof-rehearsal
          --prepared-proof-dir target/open-competition-v2-proof-prepared
          --proof-evidence-dir target/open-competition-v2-proof-evidence
          --output target/open-competition-v2-mainnet-real-proof-replay.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: open-competition-v2-beta1-real-proof-fork-${{ github.sha }}
          path: |
            target/open-competition-v2-mainnet-real-proof-replay.json
            target/open-competition-v2-mainnet-real-proof-replay.anvil.log
          if-no-files-found: error
          retention-days: 90

  prepare-live-sepolia:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_sepolia_rehearsal && github.ref == 'refs/heads/main'
    needs: [deterministic-release, real-proof-fork-rehearsal]
    environment: open-competition-v2-sepolia
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install release helper dependencies
        run: python -m pip install -r scripts/requirements-wallet.txt
      - name: Deploy or reuse exact factory and bind proof inputs
        env:
          BASE_KEEPER_PRIVATE_KEY: ${{ secrets.BASE_KEEPER_PRIVATE_KEY }}
          BASE_SEPOLIA_RPC_URL: ${{ vars.BASE_SEPOLIA_RPC_URL || 'https://sepolia.base.org' }}
        run: |
          set -euo pipefail
          forge build --root contracts/base-escrow --force --ast
          DEPLOYER="$(python -c 'import os; from eth_account import Account; print(Account.from_key(os.environ["BASE_KEEPER_PRIVATE_KEY"]).address.lower())')"
          python scripts/build_open_competition_v2_beta1_release.py \
            --network base-sepolia --rpc-url "$BASE_SEPOLIA_RPC_URL" \
            --deployer "$DEPLOYER" --source-commit "$GITHUB_SHA" \
            --output target/open-competition-v2-sepolia-plan.json
          python scripts/run_open_competition_v2_sepolia_rehearsal.py \
            --bundle target/open-competition-v2-sepolia-plan.json \
            --rpc-url "$BASE_SEPOLIA_RPC_URL" \
            --prepare-proof-fixtures target/open-competition-v2-sepolia-proof-prepared \
            --resolved-bundle-output target/open-competition-v2-sepolia-plan.json \
            --output target/open-competition-v2-sepolia-preparation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: open-competition-v2-beta1-sepolia-inputs-${{ github.sha }}
          path: |
            target/open-competition-v2-sepolia-plan.json
            target/open-competition-v2-sepolia-preparation.json
            target/open-competition-v2-sepolia-proof-prepared/*.json
          if-no-files-found: error
          retention-days: 90

  generate-live-sepolia-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_sepolia_rehearsal && github.ref == 'refs/heads/main'
    needs: [prepare-live-sepolia, build-proof-runner, verify-plonk-backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        proof: [groth16_first, plonk_best_a, plonk_best_b]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: open-competition-v2-beta1-sepolia-inputs-${{ github.sha }}
          path: target
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: open-competition-v2-beta1-prover-runner-${{ github.sha }}
          path: target/open-competition-v2-prover-runner
      - name: Verify exact runner and install helper dependencies
        run: |
          set -euo pipefail
          python -m pip install -r scripts/requirements-wallet.txt
          cd target/open-competition-v2-prover-runner
          sha256sum -c public-vector-metric-v1-script.sha256
          chmod 0755 public-vector-metric-v1-script
      - name: Configure bounded Groth16 proof memory
        if: matrix.proof == 'groth16_first'
        run: |
          set -euo pipefail
          sudo fallocate -l 12G /mnt/open-competition-v2.swap
          sudo chmod 0600 /mnt/open-competition-v2.swap
          sudo mkswap /mnt/open-competition-v2.swap
          sudo swapon /mnt/open-competition-v2.swap
          free -h
      - name: Generate and self-verify one exact Sepolia proof
        env:
          NETWORK_PRIVATE_KEY: ${{ secrets.SP1_NETWORK_PRIVATE_KEY }}
          OPEN_COMPETITION_V2_PROVER_BINARY: ${{ github.workspace }}/target/open-competition-v2-prover-runner/public-vector-metric-v1-script
          RAYON_NUM_THREADS: "2"
          SP1_PROVER: ${{ startsWith(matrix.proof, 'plonk_') && 'network' || 'cpu' }}
        run: >-
          python scripts/generate_open_competition_v2_proof.py
          --bundle target/open-competition-v2-sepolia-plan.json
          --prepared-dir target/open-competition-v2-sepolia-proof-prepared
          --proof-name "${{ matrix.proof }}"
          --output "target/open-competition-v2-sepolia-proof-evidence/${{ matrix.proof }}.json"
          --log-dir "target/open-competition-v2-sepolia-proof-logs/${{ matrix.proof }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: open-competition-v2-beta1-sepolia-proof-${{ matrix.proof }}-${{ github.sha }}
          path: |
            target/open-competition-v2-sepolia-proof-evidence/${{ matrix.proof }}.json
            target/open-competition-v2-sepolia-proof-logs/${{ matrix.proof }}/*.log
          if-no-files-found: error
          retention-days: 90

  live-sepolia-rehearsal:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_sepolia_rehearsal && github.ref == 'refs/heads/main'
    needs: [prepare-live-sepolia, generate-live-sepolia-proof]
    environment: open-competition-v2-sepolia
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: open-competition-v2-beta1-sepolia-inputs-${{ github.sha }}
          path: target
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: open-competition-v2-beta1-sepolia-proof-*-${{ github.sha }}
          path: target
          merge-multiple: true
      - name: Install live rehearsal dependencies
        run: python -m pip install -r scripts/requirements-wallet.txt
      - name: Validate proofs and execute protected live rehearsal
        env:
          BASE_KEEPER_PRIVATE_KEY: ${{ secrets.BASE_KEEPER_PRIVATE_KEY }}
          BASE_SEPOLIA_RPC_URL: ${{ vars.BASE_SEPOLIA_RPC_URL || 'https://sepolia.base.org' }}
        run: >-
          python scripts/run_open_competition_v2_sepolia_rehearsal.py
          --bundle target/open-competition-v2-sepolia-plan.json
          --rpc-url "$BASE_SEPOLIA_RPC_URL"
          --prepared-proof-dir target/open-competition-v2-sepolia-proof-prepared
          --proof-evidence-dir target/open-competition-v2-sepolia-proof-evidence
          --output target/open-competition-v2-sepolia-rehearsal.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: open-competition-v2-beta1-live-sepolia-${{ github.sha }}
          path: target/open-competition-v2-sepolia-rehearsal.json
          if-no-files-found: error
          retention-days: 90
