name: Coinbase Embedded Wallet

on:
  pull_request:
    paths:
      - ".github/workflows/coinbase-embedded-wallet.yml"
      - "tools/coinbase-wallet-adapter/**"
      - "site/wallet-adapters.js"
      - "site/wallet-runtime-config.js"
      - "site/wallet-adapters.css"
      - "site/coinbase-embedded-wallet.bundle.js"
      - "site/objective-onramp-link.js"
      - "site/objective.html"
      - "site/earn.html"
      - "site/onramp.html"
      - "site/moonpay-onramp.js"
      - "site/moonpay-direct-fallback.js"
      - "site/bounty-composer-v2.js"
      - "crates/mcp-server/src/moonpay.rs"
      - "scripts/check-coinbase-embedded-wallet.py"
      - "scripts/check-coinbase-browser-bundle.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/coinbase-embedded-wallet.yml"
      - "tools/coinbase-wallet-adapter/**"
      - "site/wallet-adapters.js"
      - "site/wallet-runtime-config.js"
      - "site/wallet-adapters.css"
      - "site/coinbase-embedded-wallet.bundle.js"
      - "site/objective-onramp-link.js"
      - "site/objective.html"
      - "site/earn.html"
      - "site/onramp.html"
      - "site/moonpay-onramp.js"
      - "site/moonpay-direct-fallback.js"
      - "site/bounty-composer-v2.js"
      - "crates/mcp-server/src/moonpay.rs"
      - "scripts/check-coinbase-embedded-wallet.py"
      - "scripts/check-coinbase-browser-bundle.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coinbase-embedded-wallet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/coinbase-wallet-adapter/package-lock.json

      - name: Prepare evidence directory
        run: mkdir -p target/coinbase-embedded-wallet

      - name: Verify provider-neutral and fail-closed source boundaries
        shell: bash
        run: |
          set -o pipefail
          python scripts/check-coinbase-embedded-wallet.py 2>&1 \
            | tee target/coinbase-embedded-wallet/source-check.log

      - name: Install exactly locked adapter dependencies
        working-directory: tools/coinbase-wallet-adapter
        shell: bash
        run: |
          set -o pipefail
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 \
            | tee ../../target/coinbase-embedded-wallet/install.log

      - name: Run EIP-1193 and sponsored-call tests
        working-directory: tools/coinbase-wallet-adapter
        run: npm test

      - name: Build the vanilla browser adapter
        working-directory: tools/coinbase-wallet-adapter
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../../target/coinbase-embedded-wallet/build.log

      - name: Verify generated adapter and reject framework leakage
        run: |
          python scripts/check-coinbase-embedded-wallet.py --require-built-bundle
          python scripts/check-coinbase-browser-bundle.py

      - name: Test pre-bounty MoonPay USDC onboarding boundary
        run: cargo test -p mcp-server moonpay

      - name: Upload reproducible verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coinbase-embedded-wallet-${{ github.run_id }}
          path: |
            target/coinbase-embedded-wallet/*.log
            site/coinbase-embedded-wallet.bundle.js
            tools/coinbase-wallet-adapter/package.json
            tools/coinbase-wallet-adapter/package-lock.json
          if-no-files-found: warn
          retention-days: 14
