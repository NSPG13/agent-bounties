name: Coinbase Embedded Wallet

on:
  pull_request:
    paths:
      - ".github/workflows/coinbase-embedded-wallet.yml"
      - "tools/coinbase-wallet-adapter/package.json"
      - "tools/coinbase-wallet-adapter/package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coinbase-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-and-verify-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coinbase-embedded-wallet-adapter
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare diagnostic directory
        run: mkdir -p target/coinbase-embedded-wallet

      - name: Regenerate the lockfile with the verification npm version
        working-directory: tools/coinbase-wallet-adapter
        shell: bash
        run: |
          set -o pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund 2>&1 \
            | tee ../../target/coinbase-embedded-wallet/lock-refresh.log

      - name: Prove a clean install, tests, and vanilla browser build
        working-directory: tools/coinbase-wallet-adapter
        shell: bash
        run: |
          set -o pipefail
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 \
            | tee ../../target/coinbase-embedded-wallet/install.log
          npm test 2>&1 | tee ../../target/coinbase-embedded-wallet/tests.log
          npm run build 2>&1 | tee ../../target/coinbase-embedded-wallet/build.log

      - name: Verify generated adapter behavior and custody boundaries
        id: embedded_check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/check-coinbase-embedded-wallet.py --require-built-bundle 2>&1 \
            | tee target/coinbase-embedded-wallet/embedded-check.log

      - name: Verify vanilla bundle and dependency pins
        id: bundle_check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/check-coinbase-browser-bundle.py 2>&1 \
            | tee target/coinbase-embedded-wallet/bundle-check.log
          git diff --exit-code -- tools/coinbase-wallet-adapter/package.json

      - name: Commit only the regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/coinbase-wallet-adapter/package-lock.json; then
            echo "Lockfile already matches the clean installer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/coinbase-wallet-adapter/package-lock.json
          git commit -m "build: regenerate the Coinbase adapter lockfile"
          git push origin HEAD:feat/coinbase-embedded-wallet-adapter

      - name: Upload regenerated lock, bundle, and checker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coinbase-lock-refresh-${{ github.run_id }}
          path: |
            target/coinbase-embedded-wallet/*.log
            tools/coinbase-wallet-adapter/package.json
            tools/coinbase-wallet-adapter/package-lock.json
            site/coinbase-embedded-wallet.bundle.js
          if-no-files-found: error
          retention-days: 14

      - name: Enforce both generated-bundle checks
        if: always() && (steps.embedded_check.outcome != 'success' || steps.bundle_check.outcome != 'success')
        run: |
          echo "One or more generated Coinbase bundle checks failed; inspect the uploaded diagnostics." >&2
          exit 1
