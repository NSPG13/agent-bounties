name: Coinbase Embedded Wallet

on:
  pull_request:
    paths:
      - ".github/workflows/coinbase-embedded-wallet.yml"
      - "scripts/cleanup-coinbase-embedded-wallet-branch.py"
      - "scripts/coinbase-embedded-wallet.final.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coinbase-embedded-wallet-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-reviewed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coinbase-embedded-wallet-adapter
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Materialize the final ordinary source files
        run: |
          python scripts/cleanup-coinbase-embedded-wallet-branch.py
          cp .github/workflows/pages.yml scripts/pages.final.yml
          git checkout -- .github/workflows

      - name: Verify the materialized source and staged workflow
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/coinbase-wallet-adapter/index.js
          python scripts/check-coinbase-embedded-wallet.py
          grep -q 'contents: read' scripts/coinbase-embedded-wallet.final.yml
          grep -q 'npm ci --ignore-scripts --no-audit --no-fund' scripts/coinbase-embedded-wallet.final.yml
          ! grep -q 'Materialize reviewed wallet source boundaries' scripts/pages.final.yml
          grep -q 'npm ci --ignore-scripts --no-audit --no-fund' scripts/pages.final.yml
          grep -q 'scripts/check-coinbase-browser-bundle.py' scripts/pages.final.yml
          grep -q 'SIM-swap' tools/coinbase-wallet-adapter/index.js
          grep -q 'unlinked methods can create separate Coinbase identities and wallets' tools/coinbase-wallet-adapter/index.js
          grep -q 'does not send authentication codes to its servers' tools/coinbase-wallet-adapter/index.js
          grep -q 'No ETH purchase is required for the embedded-wallet path' site/onramp.html

      - name: Commit source without modifying workflow paths
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/moonpay-onramp.md \
            scripts/check-coinbase-embedded-wallet.py \
            scripts/pages.final.yml \
            site/earn.html \
            site/objective.html \
            site/onramp.html \
            tools/coinbase-wallet-adapter/index.js
          git commit -m "refactor: finalize embedded wallet source boundaries"
          git push origin HEAD:feat/coinbase-embedded-wallet-adapter
