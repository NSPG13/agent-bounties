name: Coinbase Embedded Wallet

on:
  pull_request:
    paths:
      - ".github/workflows/coinbase-embedded-wallet.yml"
      - "scripts/configure-wallet-providers.py"
      - "scripts/test_configure_wallet_providers.py"
      - "docs/coinbase-embedded-wallet.md"
      - "tools/coinbase-embedded-wallet/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/coinbase-embedded-wallet.yml"
      - "scripts/configure-wallet-providers.py"
      - "scripts/test_configure_wallet_providers.py"
      - "docs/coinbase-embedded-wallet.md"
      - "tools/coinbase-embedded-wallet/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coinbase-embedded-wallet-${{ github.event_name }}-${{ github.ref || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/coinbase-embedded-wallet/package-lock.json

      - name: Install exact reviewed Coinbase dependencies
        run: npm ci --prefix tools/coinbase-embedded-wallet --ignore-scripts --no-audit --no-fund

      - name: Prepare reviewed esbuild binary
        run: npm rebuild --prefix tools/coinbase-embedded-wallet esbuild

      - name: Build the dormant adapter outside the public site
        env:
          COINBASE_WALLET_OUTDIR: /tmp/coinbase-wallet
        run: |
          npm run build --prefix tools/coinbase-embedded-wallet
          test -s /tmp/coinbase-wallet/coinbase-embedded-wallet.bundle.js
          test -s /tmp/coinbase-wallet/coinbase-embedded-wallet.bundle.css

      - name: Verify adapter source and dependency compatibility
        run: npm run check --prefix tools/coinbase-embedded-wallet

      - name: Verify project configuration and exact-origin policy
        run: python scripts/test_configure_wallet_providers.py

      - name: Audit locked production dependencies
        run: npm audit --prefix tools/coinbase-embedded-wallet --omit=dev --audit-level=high
