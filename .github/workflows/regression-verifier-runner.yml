name: Regression Verifier Runner

on:
  pull_request:
    paths:
      - "scripts/verifier_release_provenance.py"
      - "scripts/test_verifier_release_provenance.py"
      - ".github/verifier-releases/**"
      - "scripts/verifier_release.py"
      - "scripts/test_verifier_release.py"
      - "scripts/gas_sponsorship_budget.py"
      - "scripts/test_gas_sponsorship_budget.py"
      - ".cargo/**"
      - ".github/workflows/regression-verifier-runner.yml"
      - ".github/workflows/regression-verifier-signer.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "bounties/**"
      - "crates/**"
      - "contracts/base-escrow/fixtures/**"
      - "migrations/**"
      - "ops/**"
      - "programs/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "schemas/**"
      - "scripts/regression_verifier_pipeline.py"
      - "scripts/regression_verifier_source_guard.py"
      - "scripts/test_regression_verifier_pipeline.py"
      - "scripts/test_regression_verifier_source_guard.py"
      - "site/**"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: regression-verifier-runner-mainnet
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: |
          python -m unittest scripts.test_verifier_release_provenance -v
          python scripts/test_regression_verifier_pipeline.py -v
          python scripts/test_regression_verifier_source_guard.py -v
          python -m py_compile scripts/regression_verifier_pipeline.py
          cargo test -p verifier-sdk -p worker

  run-no-secrets:
    if: github.event_name == 'schedule' && vars.REGRESSION_VERIFIER_RELEASE_JSON != '' && vars.REGRESSION_WORKER_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL || 'https://api.agentbounties.app' }}
      VERIFIER_ONE: ${{ vars.REGRESSION_VERIFIER_ONE_ADDRESS }}
      VERIFIER_TWO: ${{ vars.REGRESSION_VERIFIER_TWO_ADDRESS }}
    steps:
      # Only protected workflow code may decide which release code can run.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: provenance
        name: Authorize protected release before selected source or credentials
        env:
          REGRESSION_VERIFIER_RELEASE_JSON: ${{ vars.REGRESSION_VERIFIER_RELEASE_JSON }}
          EXPECTED_RELEASE_REVISION: ""
        run: python3 -I scripts/verifier_release_provenance.py
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
        with:
          ref: ${{ steps.provenance.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Load approved release identity
        env:
          REGRESSION_VERIFIER_RELEASE_JSON: ${{ vars.REGRESSION_VERIFIER_RELEASE_JSON }}
        run: |
          mkdir -p target
          python -c 'import os,pathlib; pathlib.Path("target/verifier-release.json").write_text(os.environ["REGRESSION_VERIFIER_RELEASE_JSON"])'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/release/worker
          key: reviewed-verifier-${{ runner.os }}-${{ runner.arch }}-${{ fromJSON(vars.REGRESSION_VERIFIER_RELEASE_JSON).worker_binary_digest }}
      - name: Verify exact reviewed source and cached or downloaded binary
        env:
          REGRESSION_WORKER_URL: ${{ vars.REGRESSION_WORKER_URL }}
        run: >-
          python scripts/verifier_release.py fetch
          --manifest target/verifier-release.json
          --worker target/release/worker
          --download-url "$REGRESSION_WORKER_URL"
      - name: Check runner availability
        env:
          REGRESSION_CHECKPOINT_TOKEN: ${{ secrets.REGRESSION_RUNNER_CHECKPOINT_TOKEN }}
        run: >-
          python scripts/verifier_release.py diagnose --manifest target/verifier-release.json
          --worker target/release/worker --component runner --api-base "$API_BASE_URL"
          --health-result target/runner-health.json

      - name: Run canonical jobs without signing secrets
        run: >-
          python scripts/regression_verifier_pipeline.py run
          --api-base "$API_BASE_URL"
          --network base-mainnet
          --verifier "$VERIFIER_ONE"
          --verifier "$VERIFIER_TWO"
          --worker target/release/worker
          --staging "$RUNNER_TEMP/regression-staging"
          --output target/regression-candidates
          --max-jobs 5
          --max-scan 100

      - name: Bind candidates to the reviewed release
        run: cp target/verifier-release.json target/regression-candidates/release.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: regression-candidates-${{ github.run_id }}
          path: target/regression-candidates
          if-no-files-found: error
          retention-days: 7
