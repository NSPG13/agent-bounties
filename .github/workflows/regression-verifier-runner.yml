name: Regression Verifier Runner

on:
  pull_request:
    paths:
      - ".cargo/**"
      - ".github/workflows/regression-verifier-runner.yml"
      - ".github/workflows/regression-verifier-signer.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "bounties/**"
      - "crates/**"
      - "migrations/**"
      - "ops/**"
      - "programs/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "schemas/**"
      - "scripts/regression_verifier_pipeline.py"
      - "scripts/regression_verifier_source_guard.py"
      - "scripts/test_regression_verifier_pipeline.py"
      - "scripts/test_regression_verifier_source_guard.py"
      - "site/**"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: regression-verifier-runner-mainnet
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: |
          python scripts/test_regression_verifier_pipeline.py -v
          python scripts/test_regression_verifier_source_guard.py -v
          python scripts/regression_verifier_source_guard.py --scope worker-build --expected-sha256 0cafc0018871b90328b3acddc43bd1f9bd06ae38102c922c5c984b38ba43f060
          python scripts/regression_verifier_source_guard.py --scope signing-runtime --expected-sha256 292a6a94be6f919122558f764505119dff90f61178f1799cc362981dcf34db12
          python -m py_compile scripts/regression_verifier_pipeline.py
          cargo test -p verifier-sdk -p worker

  run-no-secrets:
    if: github.event_name == 'schedule'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL || 'https://api.agentbounties.app' }}
      VERIFIER_ONE: ${{ vars.REGRESSION_VERIFIER_ONE_ADDRESS }}
      VERIFIER_TWO: ${{ vars.REGRESSION_VERIFIER_TWO_ADDRESS }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2

      - name: Verify reviewed worker build inputs
        run: >-
          python scripts/regression_verifier_source_guard.py
          --scope worker-build
          --expected-sha256 0cafc0018871b90328b3acddc43bd1f9bd06ae38102c922c5c984b38ba43f060

      - name: Build isolated regression worker
        run: cargo build --release -p worker

      - name: Revalidate reviewed runtime after build
        run: |
          python scripts/regression_verifier_source_guard.py --scope worker-build --expected-sha256 0cafc0018871b90328b3acddc43bd1f9bd06ae38102c922c5c984b38ba43f060
          python scripts/regression_verifier_source_guard.py --scope signing-runtime --expected-sha256 292a6a94be6f919122558f764505119dff90f61178f1799cc362981dcf34db12

      - name: Run canonical jobs without signing secrets
        run: >-
          python scripts/regression_verifier_pipeline.py run
          --api-base "$API_BASE_URL"
          --network base-mainnet
          --verifier "$VERIFIER_ONE"
          --verifier "$VERIFIER_TWO"
          --worker target/release/worker
          --staging "$RUNNER_TEMP/regression-staging"
          --output target/regression-candidates
          --max-jobs 5

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: regression-candidates-${{ github.run_id }}
          path: target/regression-candidates
          if-no-files-found: error
          retention-days: 7
