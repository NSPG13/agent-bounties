name: Temporary CDP production readiness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdp-production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      COINBASE_CDP_PROJECT_ID: ${{ vars.COINBASE_CDP_PROJECT_ID }}
    steps:
      - name: Verify project variable and production-origin allowlist
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${COINBASE_CDP_PROJECT_ID}" ]]; then
            echo "::error title=CDP project not configured::Repository variable COINBASE_CDP_PROJECT_ID is absent or empty."
            exit 2
          fi
          endpoint="https://api.cdp.coinbase.com/platform/v2/embedded-wallet-api/projects/${COINBASE_CDP_PROJECT_ID}/config"
          status="$(curl --silent --show-error --output /tmp/cdp-body.json --dump-header /tmp/cdp-headers.txt --write-out '%{http_code}' --header 'Origin: https://agentbounties.app' "${endpoint}")"
          allowed_origin="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/cdp-headers.txt)"
          echo "CDP config HTTP status: ${status}"
          echo "CDP allowed origin: ${allowed_origin:-missing}"
          if [[ "${status}" != "200" ]]; then
            echo "::error title=CDP project unavailable::Coinbase project config returned HTTP ${status}."
            exit 3
          fi
          if [[ "${allowed_origin}" != "https://agentbounties.app" ]]; then
            echo "::error title=Production origin not allowlisted::Coinbase did not authorize https://agentbounties.app for this project."
            exit 4
          fi
          echo "Coinbase CDP project and exact production-origin allowlist are ready."
