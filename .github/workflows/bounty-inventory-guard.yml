name: Bounty inventory guard

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      execute_github_discovery:
        description: "Create/update GitHub bounty mirrors after reviewing the dry-run artifact"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "scripts/bounty_inventory_guard.py"
      - "scripts/test_bounty_inventory_guard.py"
      - "scripts/reconcile_github_bounty_labels.py"
      - "scripts/test_reconcile_github_bounty_labels.py"
      - "ops/github-bounty-discovery-policy.json"
      - "ops/github-bounty-landing-copy.json"
      - "crates/api/src/github_discovery.rs"
      - "crates/api/src/main.rs"
      - "scripts/fixtures/bounty_inventory_*.json"
      - "skills/agent-bounties/scripts/check-in.mjs"
      - "docs/standing-meta-bounty-invariant.md"
      - ".github/workflows/bounty-inventory-guard.yml"

permissions:
  contents: read
  issues: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run inventory guard unit tests
        run: |
          python scripts/test_bounty_inventory_guard.py -v
          python scripts/test_reconcile_github_bounty_labels.py -v

  reconcile-status-labels:
    if: github.event_name != 'pull_request'
    needs: unit-tests
    runs-on: ubuntu-latest
    concurrency:
      group: canonical-github-bounty-reconciliation
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reconcile GitHub state from canonical Base evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCOVERY_EXECUTE: ${{ (github.event_name == 'workflow_dispatch' && inputs.execute_github_discovery) || (github.event_name == 'schedule' && vars.BOUNTY_DISCOVERY_EXECUTE == 'true') }}
        run: |
          EXECUTE_ARGS=()
          if [[ "$DISCOVERY_EXECUTE" == "true" ]]; then
            EXECUTE_ARGS+=(--execute --confirm-repository "$GITHUB_REPOSITORY")
          fi
          set +e
          python scripts/reconcile_github_bounty_labels.py \
            --policy ops/github-bounty-discovery-policy.json \
            --landing-copy ops/github-bounty-landing-copy.json \
            --json-out bounty-label-reconciliation.json \
            --md-out bounty-label-reconciliation.md \
            "${EXECUTE_ARGS[@]}" 2>&1 | tee bounty-label-reconciliation.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [[ -f bounty-label-reconciliation.md ]]; then
            cat bounty-label-reconciliation.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## GitHub bounty discovery reconciliation\n\nBlocked before an evidence report was produced. See the uploaded log.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$STATUS"
      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bounty-label-reconciliation
          path: |
            bounty-label-reconciliation.json
            bounty-label-reconciliation.md
            bounty-label-reconciliation.log

  live-report:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build canonical claimable inventory report
        run: node skills/agent-bounties/scripts/check-in.mjs > claimable-inventory.json
      - name: Report verified claimable inventory floor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BOUNTY_INVENTORY_THRESHOLD: "5"
          PRIVATE_V2_INVENTORY_FLOOR: "5"
          PRIVATE_V2_INVENTORY_TARGET: "10"
          META_BOUNTY_INVENTORY_THRESHOLD: "1"
          META_BOUNTY_REPLENISHMENT_TARGET: "2"
        run: |
          python scripts/bounty_inventory_guard.py \
            --claimable-report claimable-inventory.json \
            --json-out bounty-inventory-report.json \
            --md-out bounty-inventory-report.md \
            --private-json-out "$RUNNER_TEMP/bounty-inventory-private.json"
      - name: Enforce unified liquidity and private operational floors
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("bounty-inventory-report.json").read_text())
          private = json.loads(
              Path(os.environ["RUNNER_TEMP"], "bounty-inventory-private.json").read_text()
          )
          status = (
              f"active funded opportunities: {report['active_funded_opportunities']}/"
              f"{report['minimum_active_funded_opportunities']}; protocol={report['protocol_status']}; "
              f"evidence_valid={str(report['inventory_evidence_valid']).lower()}"
          )
          operational_failure = (
              report["below_public_floor"]
              or private["private_v2_below_floor"]
              or private["meta_below_threshold"]
          )
          if operational_failure:
              print(f"::error title=Bounty liquidity invariant not met::{status}")
          elif private["private_v2_replenishment_required"]:
              print(f"::warning title=Private liquidity buffer needs replenishment::{status}")
          elif private["meta_replenishment_required"]:
              print(f"::warning title=Private liquidity buffer needs replenishment::{status}")
          else:
              print(status)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Unified marketplace liquidity\n\n")
              summary.write(f"- {status}\n")
              summary.write(
                  "- liquidity policy healthy: "
                  f"{str(not operational_failure).lower()}\n"
              )
              summary.write("- GitHub issues are candidate supply, not funding evidence.\n")
          if operational_failure:
              raise SystemExit(2)
          PY
      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bounty-inventory-report
          path: |
            bounty-inventory-report.json
            bounty-inventory-report.md
            claimable-inventory.json
