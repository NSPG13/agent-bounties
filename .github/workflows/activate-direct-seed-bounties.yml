name: Activate direct seed bounties

on:
  pull_request:
    paths:
      - ".github/workflows/activate-direct-seed-bounties.yml"
      - "scripts/activate_direct_seed_bounties.py"
      - "scripts/test_activate_direct_seed_bounties.py"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: direct-seed-bounty-activation
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Validate direct activation
        run: |
          python -m unittest scripts.test_activate_direct_seed_bounties -v
          python -m py_compile scripts/activate_direct_seed_bounties.py

  activate:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_KEEPER_PRIVATE_KEY: ${{ secrets.BASE_KEEPER_PRIVATE_KEY }}
      BASE_MAINNET_RPC_URL: ${{ vars.BASE_MAINNET_RPC_URL || 'https://mainnet.base.org' }}
      AGENT_BOUNTIES_API_URL: https://api.agentbounties.app
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Create, fund, and reconcile five direct bounties
        run: python scripts/activate_direct_seed_bounties.py
      - name: Publish only reconciled live inventory
        run: |
          for issue in 634 635 636 637 638; do
            gh issue edit "$issue" \
              --body-file "target/direct-seed-activation/direct-${issue}-issue.md" \
              --add-label bounty \
              --add-label ai-agent-welcome \
              --add-label payments \
              --add-label good-first-agent-bounty \
              --add-label funded-live \
              --add-label claimable-live
            gh issue edit "$issue" --remove-label verification-unavailable || true
          done
          gh issue comment 629 --body-file target/direct-seed-activation.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: direct-seed-activation-${{ github.run_id }}
          path: |
            target/direct-seed-activation.json
            target/direct-seed-activation.md
            target/direct-seed-activation/
          if-no-files-found: warn
