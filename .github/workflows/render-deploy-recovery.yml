name: Render Deploy Recovery
on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Attended posting closeout: inventory or restore-workflows"
        required: true
        default: inventory
        type: string
permissions:
  contents: read
  actions: write
concurrency:
  group: render-production-deploy
  cancel-in-progress: false
jobs:
  attended-posting-cutover:
    if: github.repository == 'NSPG13/agent-bounties' && github.ref == 'refs/heads/codex/posting-production-cutover-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check controller
        run: python3 scripts/test_posting_production_cutover.py
      - name: Execute exact attended application phase
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GAS_SPONSOR_BUDGET_TOKEN: ${{ secrets.GAS_SPONSOR_BUDGET_TOKEN }}
          POSTING_PHASE: ${{ inputs.revision }}
        run: python3 scripts/posting_production_cutover.py "$POSTING_PHASE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: posting-cutover-${{ github.run_id }}
          path: posting-cutover-evidence.json
          if-no-files-found: ignore
          retention-days: 30
