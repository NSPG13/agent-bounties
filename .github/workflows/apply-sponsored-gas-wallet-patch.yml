name: Apply Embedded Wallet Source Patches

on:
  push:
    branches:
      - feat/coinbase-embedded-wallet-adapter
    paths:
      - ".github/workflows/apply-sponsored-gas-wallet-patch.yml"
      - "scripts/apply-sponsored-gas-wallet-patch.py"
      - "scripts/apply-generic-moonpay-wallet-patch.py"

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply counted source replacements
        run: |
          python scripts/apply-sponsored-gas-wallet-patch.py
          python scripts/apply-generic-moonpay-wallet-patch.py

      - name: Commit source updates when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/bounty-composer-v2.js crates/mcp-server/src/moonpay.rs; then
            echo "Embedded-wallet source was already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/bounty-composer-v2.js crates/mcp-server/src/moonpay.rs
          git commit -m "fix: complete embedded wallet onboarding source paths"
          git push origin "HEAD:${GITHUB_REF_NAME}"
