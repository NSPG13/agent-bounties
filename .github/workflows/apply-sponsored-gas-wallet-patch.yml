name: Apply Sponsored Gas Wallet Patch

on:
  push:
    branches:
      - feat/coinbase-embedded-wallet-adapter
    paths:
      - ".github/workflows/apply-sponsored-gas-wallet-patch.yml"
      - "scripts/apply-sponsored-gas-wallet-patch.py"

permissions:
  contents: write

jobs:
  patch-composer-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply counted source replacement
        run: python scripts/apply-sponsored-gas-wallet-patch.py

      - name: Commit the source update when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/bounty-composer-v2.js; then
            echo "Sponsored-gas source was already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/bounty-composer-v2.js
          git commit -m "fix: honor sponsored gas in bounty composer"
          git push origin "HEAD:${GITHUB_REF_NAME}"
