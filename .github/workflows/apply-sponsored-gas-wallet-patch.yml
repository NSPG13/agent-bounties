name: Build Embedded Wallet Branch Artifacts

on:
  push:
    branches:
      - feat/coinbase-embedded-wallet-adapter
    paths:
      - ".github/workflows/apply-sponsored-gas-wallet-patch.yml"
      - "scripts/apply-sponsored-gas-wallet-patch.py"
      - "scripts/apply-generic-moonpay-wallet-patch.py"
      - "tools/coinbase-wallet-adapter/**"

permissions:
  contents: write

jobs:
  build-branch-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/coinbase-wallet-adapter/package-lock.json

      - name: Apply counted source replacements
        run: |
          python scripts/apply-sponsored-gas-wallet-patch.py
          python scripts/apply-generic-moonpay-wallet-patch.py

      - name: Install, test, and bundle Coinbase adapter
        working-directory: tools/coinbase-wallet-adapter
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
          node --check ../../site/coinbase-embedded-wallet.bundle.js

      - name: Commit generated and patched files when needed
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/bounty-composer-v2.js
            crates/mcp-server/src/moonpay.rs
            tools/coinbase-wallet-adapter/package-lock.json
            site/coinbase-embedded-wallet.bundle.js
          )
          if git diff --quiet -- "${files[@]}"; then
            echo "Embedded-wallet branch artifacts are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "build: generate embedded wallet integration artifacts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
