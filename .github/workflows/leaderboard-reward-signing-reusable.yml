name: Leaderboard Reward Signing Slot

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      candidate_run_id:
        required: true
        type: string
      signer_slot:
        required: true
        type: string
      expected_signer:
        required: true
        type: string
      reward_contract:
        required: true
        type: string
    secrets:
      signer_private_key:
        required: true

permissions:
  actions: read
  contents: read

jobs:
  sign:
    if: >-
      github.repository == 'NSPG13/agent-bounties' && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' && contains(fromJSON('["one","two"]'), inputs.signer_slot)
    environment: ${{ inputs.signer_slot == 'one' && 'legacy-verifier-one' || 'legacy-verifier-two' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL || 'https://api.agentizable.ai' }}
      BASE_MAINNET_RPC_URL: ${{ vars.BASE_MAINNET_RPC_URL || 'https://mainnet.base.org' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: leaderboard-candidates-${{ inputs.candidate_run_id }}
          path: target/leaderboard-candidates
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Re-fetch and sign exact closed-period rankings
        env:
          LEADERBOARD_SIGNER_PRIVATE_KEY: ${{ secrets.signer_private_key }}
        run: >-
          python scripts/leaderboard_reward_pipeline.py sign
          --api-base "$API_BASE_URL"
          --network base-mainnet
          --rpc-url "$BASE_MAINNET_RPC_URL"
          --contract "${{ inputs.reward_contract }}"
          --candidates target/leaderboard-candidates
          --output "target/leaderboard-attestations-${{ inputs.signer_slot }}"
          --private-key-env LEADERBOARD_SIGNER_PRIVATE_KEY
          --expected-signer "${{ inputs.expected_signer }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: leaderboard-attestations-${{ inputs.signer_slot }}
          path: target/leaderboard-attestations-${{ inputs.signer_slot }}
          if-no-files-found: error
          retention-days: 7
