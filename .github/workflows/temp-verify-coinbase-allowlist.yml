name: Temporary verify Coinbase allowlist

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-verify-coinbase-allowlist.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_ID: 9dfed88a-0b37-47e8-b867-96f1dfd0d4ee
      ORIGIN: https://agentbounties.app
      API_BASE: https://api.cdp.coinbase.com/platform
    steps:
      - name: Probe exact auth CORS header combinations
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path

          project = "9dfed88a-0b37-47e8-b867-96f1dfd0d4ee"
          origin = "https://agentbounties.app"
          base = "https://api.cdp.coinbase.com/platform"
          endpoint = f"{base}/v2/embedded-wallet-api/projects/{project}/auth/init"
          variants = [
              ("no-requested-headers", None),
              ("content-type", "content-type"),
              ("content-type-idempotency", "content-type,x-idempotency-key"),
              ("content-type-authorization", "content-type,authorization"),
              ("content-type-wallet-auth", "content-type,x-wallet-auth"),
              ("all-sdk-headers", "content-type,x-idempotency-key,authorization,x-wallet-auth"),
          ]

          def cors_headers(headers):
              return {
                  "allow_origin": headers.get("Access-Control-Allow-Origin"),
                  "allow_credentials": headers.get("Access-Control-Allow-Credentials"),
                  "allow_methods": headers.get("Access-Control-Allow-Methods"),
                  "allow_headers": headers.get("Access-Control-Allow-Headers"),
                  "vary": headers.get("Vary"),
              }

          results = []
          for name, requested in variants:
              headers = {
                  "Origin": origin,
                  "Access-Control-Request-Method": "POST",
                  "User-Agent": "agent-bounties-cdp-cors-matrix/1",
              }
              if requested:
                  headers["Access-Control-Request-Headers"] = requested
              request = urllib.request.Request(endpoint, method="OPTIONS", headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status, response_headers = response.status, response.headers
              except urllib.error.HTTPError as error:
                  status, response_headers = error.code, error.headers
              results.append({
                  "name": name,
                  "requested_headers": requested,
                  "status": status,
                  **cors_headers(response_headers),
              })

          actual = urllib.request.Request(
              endpoint,
              method="POST",
              data=b"{}",
              headers={
                  "Origin": origin,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "agent-bounties-cdp-cors-matrix/1",
              },
          )
          try:
              with urllib.request.urlopen(actual, timeout=30) as response:
                  actual_status, actual_headers = response.status, response.headers
                  actual_body = response.read(4096).decode("utf-8", errors="replace")
          except urllib.error.HTTPError as error:
              actual_status, actual_headers = error.code, error.headers
              actual_body = error.read(4096).decode("utf-8", errors="replace")
          results.append({
              "name": "actual-empty-json-post",
              "status": actual_status,
              **cors_headers(actual_headers),
              "body_is_json": False,
          })
          try:
              json.loads(actual_body)
              results[-1]["body_is_json"] = True
          except json.JSONDecodeError:
              pass

          Path("/tmp/cdp-auth-cors-matrix.json").write_text(json.dumps(results, indent=2), encoding="utf-8")
          print(json.dumps(results, indent=2))
          PY

      - name: Publish durable redacted CORS matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          results = json.loads(Path("/tmp/cdp-auth-cors-matrix.json").read_text(encoding="utf-8"))
          lines = [
              "Exact CORS matrix for the locked CDP `0.0.118` auth-init route.",
              "",
              "| Variant | HTTP | Requested headers | Allow origin | Credentials | Methods | Allowed headers |",
              "|---|---:|---|---|---|---|---|",
          ]
          for item in results:
              lines.append(
                  "| {name} | {status} | `{requested}` | `{origin}` | `{credentials}` | `{methods}` | `{headers}` |".format(
                      name=item["name"],
                      status=item["status"],
                      requested=item.get("requested_headers") or "none",
                      origin=item.get("allow_origin") or "missing",
                      credentials=item.get("allow_credentials") or "missing",
                      methods=item.get("allow_methods") or "missing",
                      headers=item.get("allow_headers") or "missing",
                  )
              )
          actual = next(item for item in results if item["name"] == "actual-empty-json-post")
          lines.extend([
              "",
              f"The safe empty-JSON POST returned HTTP `{actual['status']}` and a JSON error body: `{str(actual['body_is_json']).lower()}`.",
              "It did not contain an email, phone number, OAuth code, OTP, wallet action, transaction, or funds.",
              "",
              "No Coinbase API key, secret, OTP, OAuth credential, wallet key, transaction, or seed phrase was used.",
          ])
          Path("/tmp/cdp-auth-cors-matrix.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          url="$(gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title 'CDP 0.0.118 auth CORS matrix' \
            --body-file /tmp/cdp-auth-cors-matrix.md)"
          gh issue close --repo "${GITHUB_REPOSITORY}" "${url##*/}" --reason completed >/dev/null
