name: Activate routed V3 replacements

on:
  pull_request:
    paths:
      - ".github/workflows/activate-routed-v3-replacements.yml"
      - "scripts/activate_routed_v3_dynamic.py"
      - "scripts/activate_routed_v3_replacements.py"
      - "scripts/_shared/rpc.py"
      - "scripts/check_routed_v3_activation_readiness.py"
      - "scripts/test_activate_routed_v3_replacements.py"
      - "scripts/test_shared_rpc.py"
      - "benchmarks/direct-inventory-v1/rpc-failover/check.py"
  schedule:
    - cron: "17 * * * *"
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: routed-v3-replacement-activation-${{ github.ref || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      BASE_MAINNET_RPC_URL: ${{ vars.BASE_MAINNET_RPC_URL || 'https://mainnet.base.org' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate activation code
        run: |
          python scripts/test_shared_rpc.py -v
          WORKSPACE_ROOT=. python benchmarks/direct-inventory-v1/rpc-failover/check.py
          python -m unittest scripts.test_activate_routed_v3_replacements -v
          python -m py_compile \
            scripts/activate_routed_v3_dynamic.py \
            scripts/activate_routed_v3_replacements.py \
            scripts/check_routed_v3_activation_readiness.py

      - name: Confirm routed V3 readiness through retry-safe Base reads
        run: |
          python scripts/check_routed_v3_activation_readiness.py \
            --rpc-url "$BASE_MAINNET_RPC_URL" \
            --output target/routed-v3-readiness.json \
            --require-ready
          cat target/routed-v3-readiness.json

  activate:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.issue.number == 571 &&
       github.event.comment.user.login == 'NSPG13' &&
       github.event.comment.body == '/agent-bounty activate-routed-v3')
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_KEEPER_PRIVATE_KEY: ${{ secrets.BASE_KEEPER_PRIVATE_KEY }}
      BASE_MAINNET_RPC_URL: ${{ vars.BASE_MAINNET_RPC_URL || 'https://mainnet.base.org' }}
      AGENT_BOUNTIES_API_URL: https://api.agentbounties.app
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Stop after replacement inventory is complete
        id: issue
        run: |
          state="$(gh issue view 652 --json state --jq .state)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" = "CLOSED" ]; then
            echo "Replacement inventory issue is closed; no action remains."
          fi

      - name: Read durable policy readiness
        if: steps.issue.outputs.state != 'CLOSED'
        id: readiness
        run: |
          python scripts/check_routed_v3_activation_readiness.py \
            --rpc-url "$BASE_MAINNET_RPC_URL" \
            --output target/routed-v3-readiness.json \
            --selected-rpc-output target/routed-v3-selected-rpc.txt
          ready="$(python -c 'import json; print(str(json.load(open("target/routed-v3-readiness.json"))["ready"]).lower())')"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          rpc_url="$(cat target/routed-v3-selected-rpc.txt 2>/dev/null || true)"
          echo "rpc_url=$rpc_url" >> "$GITHUB_OUTPUT"
          cat target/routed-v3-readiness.json

      - name: Remain dormant before owner confirmation
        if: steps.issue.outputs.state != 'CLOSED' && steps.readiness.outputs.ready != 'true'
        run: echo "The exact durable PolicyConfigured state is not active. No financial action was attempted."

      - name: Create, fund, and reconcile five routed parents
        if: steps.issue.outputs.state != 'CLOSED' && steps.readiness.outputs.ready == 'true'
        id: activation
        run: >-
          python scripts/activate_routed_v3_dynamic.py
          --rpc-url '${{ steps.readiness.outputs.rpc_url }}'

      - name: Replace issue terms only after canonical reconciliation
        if: steps.issue.outputs.state != 'CLOSED' && steps.readiness.outputs.ready == 'true'
        run: |
          for issue in 647 648 649 650 651; do
            status="$(jq -r --argjson issue "$issue" '.results[] | select(.issue == $issue) | .reconciliation.feed_item.status' target/routed-v3-activation.json)"
            if [ "$status" = "claimable" ]; then
              lane="$(jq -r --argjson issue "$issue" '.results[] | select(.issue == $issue) | .lane' target/routed-v3-activation.json)"
              gh issue edit "$issue" \
                --title "[META] Earn 1 USDC margin with a ${lane} bounty" \
                --body-file "target/routed-v3-activation/routed-v3-${issue}-issue.md" \
                --add-label bounty \
                --add-label ai-agent-welcome \
                --add-label payments \
                --add-label good-first-agent-bounty \
                --add-label funded-live \
                --add-label claimable-live
              gh issue edit "$issue" --remove-label verification-unavailable || true
            else
              gh issue edit "$issue" --remove-label claimable-live || true
              if [ "$status" = "paid" ]; then
                gh issue edit "$issue" --remove-label funded-live || true
              fi
            fi
          done

      - name: Publish evidence and close completed replacement run
        if: steps.issue.outputs.state != 'CLOSED' && steps.readiness.outputs.ready == 'true'
        run: |
          new_spend="$(jq -r '.new_spend' target/routed-v3-activation.json)"
          if [ "$new_spend" != "0" ]; then
            gh issue comment 652 --body-file target/routed-v3-activation.md
          fi
          complete="$(python -c 'import json; print(str(json.load(open("target/routed-v3-activation.json"))["complete"]).lower())')"
          if [ "$complete" = "true" ]; then
            gh issue close 652 --reason completed --comment \
              "All five replacement bounties reconciled from canonical Base evidence and now expose the repaired routed-V3 child path. Only future BountySettled events prove solver payments."
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: routed-v3-replacement-activation-${{ github.run_id }}
          path: |
            target/routed-v3-readiness.json
            target/routed-v3-activation.json
            target/routed-v3-activation.md
            target/routed-v3-activation/
          if-no-files-found: warn
