name: Paid Bounty Issues

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: paid-bounty-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.issue.state == 'open'
      && !contains(github.event.issue.labels.*.name, 'funded-live')
      && !(
        contains(github.event.issue.labels.*.name, 'payments')
        && (
          contains(github.event.issue.body || '', '<!-- agent-bounties/github-discovery-v1:start -->')
          || contains(github.event.issue.body || '', '<!-- agent-bounties/github-discovery-archive-v1:start -->')
        )
        && (
          contains(github.event.issue.labels.*.name, 'funding-needed')
          || contains(github.event.issue.labels.*.name, 'funded-live')
          || contains(github.event.issue.labels.*.name, 'claimed-live')
          || contains(github.event.issue.labels.*.name, 'in-progress')
          || contains(github.event.issue.labels.*.name, 'verification-pending')
          || contains(github.event.issue.labels.*.name, 'verification-unavailable')
          || contains(github.event.issue.labels.*.name, 'refund-available')
          || contains(github.event.issue.labels.*.name, 'cancelled')
          || contains(github.event.issue.labels.*.name, 'expired')
          || contains(github.event.issue.labels.*.name, 'settled-paid')
        )
      )
      && (
        startsWith(github.event.issue.title, '[bounty]')
        || contains(github.event.issue.body || '', '### Suggested amount')
        || contains(toJson(github.event.issue.labels), '"bounty"')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Validate paid bounty issue
        run: bash scripts/github-issue-plan-comment.sh
        env:
          GH_TOKEN: ${{ github.token }}
