name: One-time GitHub key custody migration

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Seal the existing values or verify the imported environment values
        required: true
        type: choice
        options: [seal, verify]

permissions:
  contents: read
  actions: read

concurrency:
  group: one-time-key-custody
  cancel-in-progress: false

jobs:
  keeper:
    if: >-
      github.repository == 'NSPG13/agent-bounties' && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' && github.event_name == 'workflow_dispatch' &&
      github.actor == 'NSPG13' && github.triggering_actor == 'NSPG13' && github.run_attempt == 1 &&
      github.workflow_sha == vars.KEY_CUSTODY_MIGRATION_REVISION &&
      inputs.phase == vars.KEY_CUSTODY_MIGRATION_PHASE
    environment: legacy-keeper
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CUSTODY_AUTHORIZED_REVISION: ${{ vars.KEY_CUSTODY_MIGRATION_REVISION }}
      CUSTODY_AUTHORIZED_PHASE: ${{ vars.KEY_CUSTODY_MIGRATION_PHASE }}
      CUSTODY_SOURCE_RUN_ID: ${{ vars.KEY_CUSTODY_SOURCE_RUN_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Check authorization and debug controls before any key access
        run: >-
          python3 -I scripts/github_key_custody.py check --slot keeper
          --plan ops/key-custody-migration-20261107.json --directory target/key-custody
      - name: Install distribution crypto library before key access
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsodium23
      - name: Test sealed-box round trip with synthetic keys only
        run: python3 -I scripts/test_github_key_custody.py -v
      - name: Download only the authorized encrypted source envelope
        if: inputs.phase == 'verify'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: key-custody-keeper-${{ vars.KEY_CUSTODY_SOURCE_RUN_ID }}
          path: target/key-custody
          github-token: ${{ github.token }}
          run-id: ${{ vars.KEY_CUSTODY_SOURCE_RUN_ID }}
      - name: Seal original value for the reviewed GitHub environment
        if: inputs.phase == 'seal'
        env:
          CUSTODY_VALUE: ${{ secrets.BASE_KEEPER_PRIVATE_KEY }}
        run: >-
          python3 -I scripts/github_key_custody.py seal --slot keeper
          --plan ops/key-custody-migration-20261107.json --directory target/key-custody
      - name: Verify every destination alias without signing
        if: inputs.phase == 'verify'
        env:
          CUSTODY_VALUE: ${{ secrets.BASE_KEEPER_PRIVATE_KEY }}
        run: >-
          python3 -I scripts/github_key_custody.py verify --slot keeper
          --plan ops/key-custody-migration-20261107.json --directory target/key-custody
      - name: Retain ciphertext or verification receipt only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: key-custody-keeper-${{ github.run_id }}
          path: target/key-custody/keeper${{ inputs.phase == 'verify' && '-verified' || '' }}.json
          if-no-files-found: error
          retention-days: 1

  attester:
    if: >-
      github.repository == 'NSPG13/agent-bounties' && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' && github.event_name == 'workflow_dispatch' &&
      github.actor == 'NSPG13' && github.triggering_actor == 'NSPG13' && github.run_attempt == 1 &&
      github.workflow_sha == vars.KEY_CUSTODY_MIGRATION_REVISION &&
      inputs.phase == vars.KEY_CUSTODY_MIGRATION_PHASE
    environment: legacy-keeper
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CUSTODY_AUTHORIZED_REVISION: ${{ vars.KEY_CUSTODY_MIGRATION_REVISION }}
      CUSTODY_AUTHORIZED_PHASE: ${{ vars.KEY_CUSTODY_MIGRATION_PHASE }}
      CUSTODY_SOURCE_RUN_ID: ${{ vars.KEY_CUSTODY_SOURCE_RUN_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Check authorization and debug controls before any key access
        run: >-
          python3 -I scripts/github_key_custody.py check --slot attester
          --plan ops/key-custody-migration-20261107.json --directory target/key-custody
      - name: Install distribution crypto library before key access
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsodium23
      - name: Test sealed-box round trip with synthetic keys only
        run: python3 -I scripts/test_github_key_custody.py -v
      - name: Download only the authorized encrypted source envelope
        if: inputs.phase == 'verify'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: key-custody-attester-${{ vars.KEY_CUSTODY_SOURCE_RUN_ID }}
          path: target/key-custody
          github-token: ${{ github.token }}
          run-id: ${{ vars.KEY_CUSTODY_SOURCE_RUN_ID }}
      - name: Seal original value for the reviewed GitHub environment
        if: inputs.phase == 'seal'
        env:
          CUSTODY_VALUE: ${{ secrets.PARTICIPANT_ATTESTER_PRIVATE_KEY }}
        run: >-
          python3 -I scripts/github_key_custody.py seal --slot attester
          --plan ops/key-custody-migration-20261107.json --directory target/key-custody
      - name: Verify every destination alias without signing
        if: inputs.phase == 'verify'
        env:
          CUSTODY_VALUE: ${{ secrets.PARTICIPANT_ATTESTER_PRIVATE_KEY }}
        run: >-
          python3 -I scripts/github_key_custody.py verify --slot attester
          --plan ops/key-custody-migration-20261107.json --directory target/key-custody
      - name: Retain ciphertext or verification receipt only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: key-custody-attester-${{ github.run_id }}
          path: target/key-custody/attester${{ inputs.phase == 'verify' && '-verified' || '' }}.json
          if-no-files-found: error
          retention-days: 1

  verifier-one:
    if: >-
      github.repository == 'NSPG13/agent-bounties' && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' && github.event_name == 'workflow_dispatch' &&
      github.actor == 'NSPG13' && github.triggering_actor == 'NSPG13' && github.run_attempt == 1 &&
      github.workflow_sha == vars.KEY_CUSTODY_MIGRATION_REVISION &&
      inputs.phase == vars.KEY_CUSTODY_MIGRATION_PHASE
    environment: legacy-verifier-one
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CUSTODY_AUTHORIZED_REVISION: ${{ vars.KEY_CUSTODY_MIGRATION_REVISION }}
      CUSTODY_AUTHORIZED_PHASE: ${{ vars.KEY_CUSTODY_MIGRATION_PHASE }}
      CUSTODY_SOURCE_RUN_ID: ${{ vars.KEY_CUSTODY_SOURCE_RUN_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Check authorization and debug controls before any key access
        run: >-
          python3 -I scripts/github_key_custody.py check --slot verifier-one
          --plan ops/key-custody-migration-20261107.json --directory target/key-custody
      - name: Install distribution crypto library before key access
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsodium23
      - name: Test sealed-box round trip with synthetic keys only
        run: python3 -I scripts/test_github_key_custody.py -v
      - name: Download only the authorized encrypted source envelope
        if: inputs.phase == 'verify'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: key-custody-verifier-one-${{ vars.KEY_CUSTODY_SOURCE_RUN_ID }}
          path: target/key-custody
          github-token: ${{ github.token }}
          run-id: ${{ vars.KEY_CUSTODY_SOURCE_RUN_ID }}
      - name: Seal original value for the reviewed GitHub environment
        if: inputs.phase == 'seal'
        env:
          CUSTODY_VALUE: ${{ secrets.REGRESSION_VERIFIER_ONE_PRIVATE_KEY }}
        run: >-
          python3 -I scripts/github_key_custody.py seal --slot verifier-one
          --plan ops/key-custody-migration-20261107.json --directory target/key-custody
      - name: Verify every destination alias without signing
        if: inputs.phase == 'verify'
        env:
          CUSTODY_VALUE: ${{ secrets.REGRESSION_VERIFIER_ONE_PRIVATE_KEY }}
          CUSTODY_VERIFIER_ALIAS: ${{ secrets.VERIFIER_PRIVATE_KEY }}
          CUSTODY_SIGNER_ALIAS: ${{ secrets.SIGNER_PRIVATE_KEY }}
        run: >-
          python3 -I scripts/github_key_custody.py verify --slot verifier-one
          --plan ops/key-custody-migration-20261107.json --directory target/key-custody
      - name: Retain ciphertext or verification receipt only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: key-custody-verifier-one-${{ github.run_id }}
          path: target/key-custody/verifier-one${{ inputs.phase == 'verify' && '-verified' || '' }}.json
          if-no-files-found: error
          retention-days: 1

  verifier-two:
    if: >-
      github.repository == 'NSPG13/agent-bounties' && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' && github.event_name == 'workflow_dispatch' &&
      github.actor == 'NSPG13' && github.triggering_actor == 'NSPG13' && github.run_attempt == 1 &&
      github.workflow_sha == vars.KEY_CUSTODY_MIGRATION_REVISION &&
      inputs.phase == vars.KEY_CUSTODY_MIGRATION_PHASE
    environment: legacy-verifier-two
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CUSTODY_AUTHORIZED_REVISION: ${{ vars.KEY_CUSTODY_MIGRATION_REVISION }}
      CUSTODY_AUTHORIZED_PHASE: ${{ vars.KEY_CUSTODY_MIGRATION_PHASE }}
      CUSTODY_SOURCE_RUN_ID: ${{ vars.KEY_CUSTODY_SOURCE_RUN_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Check authorization and debug controls before any key access
        run: >-
          python3 -I scripts/github_key_custody.py check --slot verifier-two
          --plan ops/key-custody-migration-20261107.json --directory target/key-custody
      - name: Install distribution crypto library before key access
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsodium23
      - name: Test sealed-box round trip with synthetic keys only
        run: python3 -I scripts/test_github_key_custody.py -v
      - name: Download only the authorized encrypted source envelope
        if: inputs.phase == 'verify'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: key-custody-verifier-two-${{ vars.KEY_CUSTODY_SOURCE_RUN_ID }}
          path: target/key-custody
          github-token: ${{ github.token }}
          run-id: ${{ vars.KEY_CUSTODY_SOURCE_RUN_ID }}
      - name: Seal original value for the reviewed GitHub environment
        if: inputs.phase == 'seal'
        env:
          CUSTODY_VALUE: ${{ secrets.REGRESSION_VERIFIER_TWO_PRIVATE_KEY }}
        run: >-
          python3 -I scripts/github_key_custody.py seal --slot verifier-two
          --plan ops/key-custody-migration-20261107.json --directory target/key-custody
      - name: Verify every destination alias without signing
        if: inputs.phase == 'verify'
        env:
          CUSTODY_VALUE: ${{ secrets.REGRESSION_VERIFIER_TWO_PRIVATE_KEY }}
          CUSTODY_VERIFIER_ALIAS: ${{ secrets.VERIFIER_PRIVATE_KEY }}
          CUSTODY_SIGNER_ALIAS: ${{ secrets.SIGNER_PRIVATE_KEY }}
        run: >-
          python3 -I scripts/github_key_custody.py verify --slot verifier-two
          --plan ops/key-custody-migration-20261107.json --directory target/key-custody
      - name: Retain ciphertext or verification receipt only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: key-custody-verifier-two-${{ github.run_id }}
          path: target/key-custody/verifier-two${{ inputs.phase == 'verify' && '-verified' || '' }}.json
          if-no-files-found: error
          retention-days: 1
