name: Apply MoonPay integration

on:
  push:
    branches: [codex/moonpay-base-onramp]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-moonpay-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.event_name == 'push' || github.head_ref == 'codex/moonpay-base-onramp'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Materialize reviewed integration payload
        run: python scripts/bootstrap-moonpay-integration.py

      - name: Apply bounded integration seams
        shell: bash
        run: |
          set -o pipefail
          python scripts/apply-moonpay-integration.py 2>&1 | tee moonpay-apply.log

      - name: Format and test MoonPay backend
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all
            cargo clippy -p mcp-server -- -D warnings
            cargo test -p mcp-server moonpay -- --nocapture
          } 2>&1 | tee moonpay-rust.log

      - name: Verify browser handoff and repository contracts
        shell: bash
        run: |
          set -o pipefail
          {
            python scripts/check-moonpay-onramp.py
            python scripts/check-site.py
            python scripts/check-render-blueprint.py
            git diff --check
          } 2>&1 | tee moonpay-site.log

      - name: Upload verifier diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: moonpay-verifier-${{ github.run_id }}
          path: moonpay-*.log
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified generated changes
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          rm -rf scripts/.moonpay-payload
          rm -f scripts/bootstrap-moonpay-integration.py
          rm -f .github/workflows/apply-moonpay-integration.yml
          rm -f scripts/apply-moonpay-integration.py
          rm -f moonpay-*.log
          git config user.name "agent-bounties-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add MoonPay Base wallet on-ramp"
          git push origin "HEAD:${BRANCH}"
