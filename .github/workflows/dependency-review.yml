name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Enforce disabled V2 SP1 advisory quarantine
        run: python scripts/verify_sp1_advisory_quarantine.py

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          # SP1 6.3.1 still resolves a transcript dependency covered by this
          # advisory. The preceding gate confines it to the disabled V2 proof
          # toolchain and prevents high-severity or mainnet gates from passing.
          allow-ghsas: GHSA-vj64-rjf3-w3v7
