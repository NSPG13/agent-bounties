name: Pages

on:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "deployments/bounded-agent-wallet-base-mainnet.json"
      - "site/**"
      - "tools/coinbase-wallet-adapter/**"
      - "scripts/check-site.py"
      - "scripts/check-moonpay-onramp.py"
      - "scripts/check-coinbase-embedded-wallet.py"
      - "scripts/configure-wallet-runtime.py"
      - "scripts/apply-sponsored-gas-wallet-patch.py"
      - "scripts/apply-generic-moonpay-wallet-patch.py"
      - "scripts/apply-embedded-wallet-ui-patch.py"
      - "scripts/test-homepage-bounty-wiring.py"
      - "scripts/test-homepage-bounty-flow.js"
      - "scripts/test-ai-bounty-handoff.js"
      - "scripts/test-moonpay-direct-fallback.js"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "deployments/bounded-agent-wallet-base-mainnet.json"
      - "site/**"
      - "tools/coinbase-wallet-adapter/**"
      - "scripts/check-site.py"
      - "scripts/check-moonpay-onramp.py"
      - "scripts/check-coinbase-embedded-wallet.py"
      - "scripts/configure-wallet-runtime.py"
      - "scripts/apply-sponsored-gas-wallet-patch.py"
      - "scripts/apply-generic-moonpay-wallet-patch.py"
      - "scripts/apply-embedded-wallet-ui-patch.py"
      - "scripts/test-homepage-bounty-wiring.py"
      - "scripts/test-homepage-bounty-flow.js"
      - "scripts/test-ai-bounty-handoff.js"
      - "scripts/test-moonpay-direct-fallback.js"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Materialize reviewed wallet source boundaries
        run: |
          python scripts/apply-sponsored-gas-wallet-patch.py
          python scripts/apply-generic-moonpay-wallet-patch.py
          python scripts/apply-embedded-wallet-ui-patch.py

      - name: Verify fail-closed wallet source
        run: python scripts/check-coinbase-embedded-wallet.py

      - name: Install pinned Coinbase adapter dependencies
        working-directory: tools/coinbase-wallet-adapter
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test and build Coinbase wallet adapter
        working-directory: tools/coinbase-wallet-adapter
        run: |
          npm test
          npm run build

      - name: Verify built adapter and wallet onboarding
        run: |
          python scripts/check-coinbase-embedded-wallet.py --require-built-bundle
          python scripts/check-moonpay-onramp.py
          python scripts/check-site.py
          python scripts/test-homepage-bounty-wiring.py
          node scripts/test-homepage-bounty-flow.js
          node scripts/test-ai-bounty-handoff.js

      - name: Check simplified public scripts
        run: |
          node --check site/wallet-runtime-config.js
          node --check site/wallet-adapters.js
          node --check site/coinbase-embedded-wallet.bundle.js
          node --check site/objective-onramp-link.js
          node --check site/moonpay-onramp.js
          node --check site/moonpay-direct-fallback.js
          node --check site/bounty-board.js
          node --check site/bounty-entry.js
          node --check site/ai-bounty-handoff.js
          node --check site/bounty-composer-v2.js
          node --check site/bounty-chat-ui.js
          node --check site/simple-home.js
          node --check site/guild-shell.js
          grep -q 'data-primary-bounty-cta>Post a bounty</a>' site/index.html
          grep -q 'class="mode-switch"' site/index.html
          grep -q 'action="objective.html"' site/index.html
          grep -q 'src="bounty-entry.js?v=1"' site/index.html
          ! grep -q 'data-connect-wallet' site/index.html
          ! grep -q 'class="network-chip"' site/index.html
          grep -q 'AGENT MODE · NO COMPUTER USE REQUIRED' site/agent/index.html
          grep -q 'No computer use is required' site/agent/index.md
          grep -q '"agent_mode": "https://agentbounties.app/agent/"' site/.well-known/agent-bounties.json
          grep -q 'data-board-search' site/earn.html
          grep -q 'id="fund-bounty-panel"' site/earn.html
          grep -q 'Connect or create wallet' site/earn.html
          grep -q 'wallet-runtime-config.js?v=1' site/earn.html
          grep -q 'wallet-adapters.js?v=1' site/earn.html
          grep -q 'coinbase-embedded-wallet.bundle.js?v=1' site/earn.html
          grep -q 'class="composer-page chat-app-page"' site/objective.html
          grep -q 'class="chat-app-header"' site/objective.html
          grep -q 'id="bounty-composer-form"' site/objective.html
          grep -q 'data-bounty-chat' site/objective.html
          grep -q 'data-conversation-log' site/objective.html
          grep -q 'id="bounty-preview"' site/objective.html
          grep -q 'data-mission-context' site/objective.html
          grep -q 'data-image-status' site/objective.html
          grep -q 'data-approve-card' site/objective.html
          grep -q 'data-open-funding' site/objective.html
          grep -q 'Create or connect wallet' site/objective.html
          grep -q 'data-payment-method="crypto"' site/objective.html
          grep -q 'data-objective-onramp-link' site/objective.html
          grep -q 'wallet-runtime-config.js?v=1' site/objective.html
          grep -q 'wallet-adapters.js?v=1' site/objective.html
          grep -q 'coinbase-embedded-wallet.bundle.js?v=1' site/objective.html
          grep -q 'ai-bounty-handoff.js?v=5' site/objective.html
          grep -q 'bounty-composer-v2.js?v=3' site/objective.html
          grep -q 'objective-onramp-link.js?v=1' site/objective.html
          grep -q 'bounty-entry.js?v=1' site/objective.html
          grep -q 'bounty-chat-ui.js?v=4' site/objective.html
          grep -q 'data-ai-draft-import' site/objective.html
          grep -q 'prepare_bounty_post' site/ai-bounty-handoff.js
          ! grep -q 'chat-composer-intro' site/objective.html
          ! grep -q 'draft-panel' site/objective.html
          grep -q 'dataset.bountyComposer = "chat-v2"' site/bounty-chat-ui.js
          grep -q 'entryIntent.autostart' site/bounty-chat-ui.js
          grep -q 'form.requestSubmit()' site/bounty-chat-ui.js
          grep -q 'log.append(preview)' site/bounty-chat-ui.js
          grep -q 'body.classList.contains("chat-app-page")' site/analytics-config.js
          grep -q 'x-agent-bounties-draft-visual' site/bounty-composer-v2.js
          grep -q 'agentBountiesGasSponsored===true' site/bounty-composer-v2.js
          grep -q 'MAX_TASK_DAYS = 30' site/bounty-composer-v2.js
          grep -q 'Ongoing' site/bounty-composer-v2.js
          grep -q 'Buying USDC does not fund, claim, or post a bounty' site/onramp.html
          grep -q 'data-onramp-asset type="hidden" value="usdc"' site/onramp.html
          ! grep -q '<option value="eth">' site/onramp.html
          grep -q 'You ask. Someone helps. They show proof. They get paid.' site/how-it-works.html

      - name: Verify public runtime activation substitution
        env:
          CDP_PROJECT_ID: test-project-123456
        run: |
          cp site/wallet-runtime-config.js /tmp/wallet-runtime-config.js
          python scripts/configure-wallet-runtime.py \
            --file /tmp/wallet-runtime-config.js \
            --project-id "${CDP_PROJECT_ID}" \
            --require-enabled
          grep -q 'enabled: true' /tmp/wallet-runtime-config.js
          grep -q 'projectId: "test-project-123456"' /tmp/wallet-runtime-config.js
          grep -q 'gasSponsorshipMode: "eip7702-cdp-paymaster"' /tmp/wallet-runtime-config.js

      - name: Verify production analytics substitution preserves the public shell
        env:
          GA_MEASUREMENT_ID: G-TEST123
        run: |
          cp site/analytics-config.js /tmp/analytics-config.js
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("/tmp/analytics-config.js")
          source = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'googleMeasurementId:\s*"(?:|G-[A-Z0-9]+)"',
              f'googleMeasurementId: "{os.environ["GA_MEASUREMENT_ID"]}"',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("analytics configuration assignment was not found exactly once")
          for required in ("loadGuildShell", "guild-pages.css", "guild-shell.js", "simple-home.js", "chat-app-page"):
              if required not in updated:
                  raise SystemExit(f"Pages analytics substitution removed {required}")
          path.write_text(updated, encoding="utf-8")
          PY
          grep -q 'googleMeasurementId: "G-TEST123"' /tmp/analytics-config.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Materialize reviewed wallet source boundaries
        run: |
          python scripts/apply-sponsored-gas-wallet-patch.py
          python scripts/apply-generic-moonpay-wallet-patch.py
          python scripts/apply-embedded-wallet-ui-patch.py

      - name: Build the pinned Coinbase wallet adapter
        working-directory: tools/coinbase-wallet-adapter
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npm run build

      - name: Activate Coinbase wallet only with the configured public Project ID
        env:
          CDP_PROJECT_ID: ${{ vars.CDP_PROJECT_ID }}
        run: |
          python scripts/configure-wallet-runtime.py \
            --file site/wallet-runtime-config.js \
            --project-id "${CDP_PROJECT_ID}"
          if [[ -n "${CDP_PROJECT_ID}" ]]; then
            grep -q 'enabled: true' site/wallet-runtime-config.js
          else
            grep -q 'enabled: false' site/wallet-runtime-config.js
          fi

      - uses: actions/configure-pages@v6

      - name: Configure optional Google Analytics without removing the public shell
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: |
          if [[ -n "${GA_MEASUREMENT_ID}" && ! "${GA_MEASUREMENT_ID}" =~ ^G-[A-Z0-9]+$ ]]; then
            echo "GA_MEASUREMENT_ID must match G-[A-Z0-9]+" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("site/analytics-config.js")
          source = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'googleMeasurementId:\s*"(?:|G-[A-Z0-9]+)"',
              f'googleMeasurementId: "{os.environ.get("GA_MEASUREMENT_ID", "")}"',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("analytics configuration assignment was not found exactly once")
          for required in ("loadGuildShell", "guild-pages.css", "guild-shell.js", "simple-home.js", "chat-app-page"):
              if required not in updated:
                  raise SystemExit(f"refusing to deploy without {required}")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Stage bounded-wallet deployment manifest
        run: |
          cp deployments/bounded-agent-wallet-base-mainnet.json site/bounded-agent-wallet-base-mainnet.json
          mkdir -p site/schemas
          cp schemas/discovery-manifest.v2.json site/schemas/discovery-manifest.v2.json

      - name: Verify the staged production wallet surface
        run: |
          python scripts/check-coinbase-embedded-wallet.py --require-built-bundle || {
            # The checker expects the source runtime to be fail-closed. The staged runtime may now be enabled,
            # so perform the production-specific checks below instead of weakening the source invariant.
            node --check site/coinbase-embedded-wallet.bundle.js
            grep -q 'agent-bounties/coinbase-embedded-wallet-v1' site/coinbase-embedded-wallet.bundle.js
            grep -q 'useCdpPaymaster' site/coinbase-embedded-wallet.bundle.js
            grep -q 'enableSpendPermissions' site/coinbase-embedded-wallet.bundle.js
            grep -q 'wallet-runtime-config.js?v=1' site/objective.html
            grep -q 'coinbase-embedded-wallet.bundle.js?v=1' site/objective.html
          }

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify user-owned AI and embedded-wallet production surfaces
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_CANARY_ISSUE: "499"
          CDP_PROJECT_ID: ${{ vars.CDP_PROJECT_ID }}
        run: |
          set -euo pipefail
          expected_build="$(head -n 1 site/live-guild-build.txt | tr -d '\r\n')"
          success=false
          attempt_used=0
          failure_detail="deployment has not propagated"

          for attempt in $(seq 1 60); do
            attempt_used="${attempt}"
            nonce="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}-${attempt}-$(date +%s)"
            common_curl=(--fail --silent --show-error --location --retry 2 --retry-delay 1 --header "Cache-Control: no-cache" --header "Pragma: no-cache")

            if curl "${common_curl[@]}" "https://agentbounties.app/live-guild-build.txt?verify=${nonce}" -o /tmp/live-canary.txt \
              && curl "${common_curl[@]}" "https://agentbounties.app/?verify=${nonce}" -o /tmp/live-index.html \
              && curl "${common_curl[@]}" "https://agentbounties.app/agent/?verify=${nonce}" -o /tmp/live-agent.html \
              && curl "${common_curl[@]}" "https://agentbounties.app/agent/index.md?verify=${nonce}" -o /tmp/live-agent.md \
              && curl "${common_curl[@]}" "https://agentbounties.app/.well-known/agent-bounties.json?verify=${nonce}" -o /tmp/live-agent-manifest.json \
              && curl "${common_curl[@]}" "https://agentbounties.app/earn.html?verify=${nonce}" -o /tmp/live-earn.html \
              && curl "${common_curl[@]}" "https://agentbounties.app/objective.html?verify=${nonce}" -o /tmp/live-objective.html \
              && curl "${common_curl[@]}" "https://agentbounties.app/onramp.html?verify=${nonce}" -o /tmp/live-onramp.html \
              && curl "${common_curl[@]}" "https://agentbounties.app/wallet-runtime-config.js?verify=${nonce}" -o /tmp/live-wallet-runtime.js \
              && curl "${common_curl[@]}" "https://agentbounties.app/wallet-adapters.js?verify=${nonce}" -o /tmp/live-wallet-adapters.js \
              && curl "${common_curl[@]}" "https://agentbounties.app/coinbase-embedded-wallet.bundle.js?verify=${nonce}" -o /tmp/live-coinbase-wallet.js \
              && curl "${common_curl[@]}" "https://agentbounties.app/moonpay-onramp.js?verify=${nonce}" -o /tmp/live-moonpay-onramp.js \
              && curl "${common_curl[@]}" "https://agentbounties.app/bounty-chat.css?verify=${nonce}" -o /tmp/live-chat.css \
              && curl "${common_curl[@]}" "https://agentbounties.app/ai-bounty-handoff.css?verify=${nonce}" -o /tmp/live-ai-handoff.css \
              && curl "${common_curl[@]}" "https://agentbounties.app/ai-bounty-handoff.js?verify=${nonce}" -o /tmp/live-ai-handoff.js \
              && curl "${common_curl[@]}" "https://agentbounties.app/bounty-composer-v2.js?verify=${nonce}" -o /tmp/live-composer.js \
              && curl "${common_curl[@]}" "https://agentbounties.app/bounty-chat-ui.js?verify=${nonce}" -o /tmp/live-chat-ui.js \
              && curl "${common_curl[@]}" "https://agentbounties.app/bounty-entry.js?verify=${nonce}" -o /tmp/live-entry.js \
              && curl "${common_curl[@]}" "https://agentbounties.app/how-it-works.html?verify=${nonce}" -o /tmp/live-how.html \
              && curl "${common_curl[@]}" "https://agentbounties.app/analytics-config.js?verify=${nonce}" -o /tmp/live-analytics.js \
              && curl "${common_curl[@]}" "https://agentbounties.app/simple-home.js?verify=${nonce}" -o /tmp/live-simple-home.js; then
              actual_build="$(head -n 1 /tmp/live-canary.txt | tr -d '\r\n')"
              wallet_runtime_ok=false
              if [[ -n "${CDP_PROJECT_ID}" ]]; then
                if grep -q 'enabled: true' /tmp/live-wallet-runtime.js \
                  && grep -Fq "projectId: \"${CDP_PROJECT_ID}\"" /tmp/live-wallet-runtime.js; then
                  wallet_runtime_ok=true
                fi
              elif grep -q 'enabled: false' /tmp/live-wallet-runtime.js \
                && grep -q 'projectId: ""' /tmp/live-wallet-runtime.js; then
                wallet_runtime_ok=true
              fi

              if [[ "${actual_build}" == "${expected_build}" ]] \
                && [[ "${wallet_runtime_ok}" == "true" ]] \
                && grep -q 'data-primary-bounty-cta>Post a bounty</a>' /tmp/live-index.html \
                && grep -q 'class="mode-switch"' /tmp/live-index.html \
                && grep -q 'action="objective.html"' /tmp/live-index.html \
                && ! grep -q 'data-connect-wallet' /tmp/live-index.html \
                && ! grep -q 'class="network-chip"' /tmp/live-index.html \
                && grep -q 'AGENT MODE · NO COMPUTER USE REQUIRED' /tmp/live-agent.html \
                && grep -q 'No computer use is required' /tmp/live-agent.md \
                && grep -q '"agent_mode": "https://agentbounties.app/agent/"' /tmp/live-agent-manifest.json \
                && grep -q 'data-public-ux="simplified-v1"' /tmp/live-earn.html \
                && grep -q 'Connect or create wallet' /tmp/live-earn.html \
                && grep -q 'coinbase-embedded-wallet.bundle.js?v=1' /tmp/live-earn.html \
                && grep -q 'class="composer-page chat-app-page"' /tmp/live-objective.html \
                && grep -q 'Create or connect wallet' /tmp/live-objective.html \
                && grep -q 'coinbase-embedded-wallet.bundle.js?v=1' /tmp/live-objective.html \
                && grep -q 'objective-onramp-link.js?v=1' /tmp/live-objective.html \
                && grep -q 'data-ai-draft-import' /tmp/live-objective.html \
                && grep -q 'Buying USDC does not fund, claim, or post a bounty' /tmp/live-onramp.html \
                && grep -q 'data-onramp-asset type="hidden" value="usdc"' /tmp/live-onramp.html \
                && ! grep -q '<option value="eth">' /tmp/live-onramp.html \
                && grep -q 'agent-bounties/wallet-adapter-registry-v1' /tmp/live-wallet-adapters.js \
                && grep -q 'agent-bounties/coinbase-embedded-wallet-v1' /tmp/live-coinbase-wallet.js \
                && grep -q 'useCdpPaymaster' /tmp/live-coinbase-wallet.js \
                && grep -q 'enableSpendPermissions' /tmp/live-coinbase-wallet.js \
                && grep -q 'protocol_action_completed !== false' /tmp/live-moonpay-onramp.js \
                && grep -q 'agentBountiesGasSponsored===true' /tmp/live-composer.js \
                && grep -q '.chat-app-header' /tmp/live-chat.css \
                && grep -q '.ai-provider-grid' /tmp/live-ai-handoff.css \
                && grep -q 'prepare_bounty_post' /tmp/live-ai-handoff.js \
                && grep -q 'agent-bounties:prepared-draft' /tmp/live-ai-handoff.js \
                && grep -q 'dataset.bountyComposer = "chat-v2"' /tmp/live-chat-ui.js \
                && grep -q 'entryIntent.autostart' /tmp/live-chat-ui.js \
                && grep -q 'agent-bounties:homepage-bounty-intent' /tmp/live-entry.js \
                && grep -q 'body.classList.contains("chat-app-page")' /tmp/live-analytics.js \
                && grep -q 'You ask. Someone helps. They show proof. They get paid.' /tmp/live-how.html \
                && grep -q 'simple-home.js' /tmp/live-analytics.js \
                && grep -q '\["earn.html", "Bounty Board"\]' /tmp/live-simple-home.js \
                && grep -q '\["how-it-works.html", "How It Works"\]' /tmp/live-simple-home.js \
                && ! grep -q 'Open Source' /tmp/live-simple-home.js; then
                success=true
                failure_detail=""
                break
              fi
              failure_detail="expected build ${expected_build}, received ${actual_build:-empty}, or wallet/chatbot markers were missing"
            else
              failure_detail="one or more live URLs returned a non-success response"
            fi
            sleep 5
          done

          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          wallet_state="fail-closed"
          if [[ -n "${CDP_PROJECT_ID}" ]]; then wallet_state="activated"; fi
          if [[ "${success}" == "true" ]]; then
            cat > /tmp/live-proof.md <<EOF
          ✅ **Embedded-wallet and user-owned AI canary passed**

          - Commit: \`${GITHUB_SHA}\`
          - Expected and live build: \`${expected_build}\`
          - Coinbase runtime state: \`${wallet_state}\`
          - Attempts: ${attempt_used}
          - Verified at: ${verified_at}
          - The deployed Coinbase adapter is vendor-isolated, non-custodial, EOA-compatible, and routes embedded-wallet transactions through the reviewed sponsored-gas path with spend permissions disabled.
          - MoonPay remains a Base-USDC acquisition step; every bounty action requires a separate approval and canonical event.
          - Workflow: ${run_url}
          EOF
          else
            cat > /tmp/live-proof.md <<EOF
          ❌ **Embedded-wallet and user-owned AI canary failed**

          - Commit: \`${GITHUB_SHA}\`
          - Expected build: \`${expected_build}\`
          - Coinbase runtime state expected: \`${wallet_state}\`
          - Attempts: ${attempt_used}
          - Last failure: ${failure_detail}
          - Checked at: ${verified_at}
          - Workflow: ${run_url}
          EOF
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${LIVE_CANARY_ISSUE}/comments" --raw-field body="$(cat /tmp/live-proof.md)"
          [[ "${success}" == "true" ]]
