name: Pages

on:
  schedule:
    - cron: "17 * * * *"
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "scripts/check-site.py"
      - "scripts/test-solarpunk-home.js"
      - "scripts/test-ai-bounty-handoff.js"
      - "scripts/test-metrics-dashboard.js"
      - "scripts/test-marketplace-ui.js"
      - "scripts/test-webmcp.js"
      - "scripts/test-meta-child.js"
      - "scripts/fixtures/meta-child-plan.json"
      - "scripts/test-competition-proof.js"
      - "scripts/test-phone-wallet.js"
      - "scripts/test-phone-wallet-network.cjs"
      - "scripts/test-phone-wallet-storage.cjs"
      - "scripts/test-posting-layout.cjs"
      - "tools/browser-layout/**"
      - "scripts/configure-phone-wallet.py"
      - "scripts/configure-wallet-providers.py"
      - "scripts/test-wallet-link.js"
      - "tools/coinbase-embedded-wallet/**"
      - "tools/phone-wallet/**"
      - "scripts/github_audience_audit.py"
      - "scripts/test_github_audience_audit.py"
      - "scripts/fixtures/github_participation_metrics.json"
      - "crates/api/fixtures/public-metrics-policy.json"
      - "deployments/base-mainnet.json"
      - "schemas/discovery-manifest.v2.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "scripts/check-site.py"
      - "scripts/test-solarpunk-home.js"
      - "scripts/test-ai-bounty-handoff.js"
      - "scripts/test-metrics-dashboard.js"
      - "scripts/test-marketplace-ui.js"
      - "scripts/test-webmcp.js"
      - "scripts/test-meta-child.js"
      - "scripts/fixtures/meta-child-plan.json"
      - "scripts/test-competition-proof.js"
      - "scripts/test-phone-wallet.js"
      - "scripts/test-phone-wallet-network.cjs"
      - "scripts/test-phone-wallet-storage.cjs"
      - "scripts/test-posting-layout.cjs"
      - "tools/browser-layout/**"
      - "scripts/configure-phone-wallet.py"
      - "scripts/configure-wallet-providers.py"
      - "scripts/test-wallet-link.js"
      - "tools/coinbase-embedded-wallet/**"
      - "tools/phone-wallet/**"
      - "scripts/github_audience_audit.py"
      - "scripts/test_github_audience_audit.py"
      - "scripts/fixtures/github_participation_metrics.json"
      - "crates/api/fixtures/public-metrics-policy.json"
      - "deployments/base-mainnet.json"
      - "schemas/discovery-manifest.v2.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - run: python -m pip install -r scripts/requirements-site.txt
      - name: Verify pinned phone-wallet bundle
        working-directory: tools/phone-wallet
        run: |
          npm ci --ignore-scripts --no-fund
          npm run check
      - name: Build and verify the account embedded wallet
        env:
          COINBASE_WALLET_OUTDIR: site/vendor
        run: |
          npm ci --prefix tools/coinbase-embedded-wallet --ignore-scripts --no-audit --no-fund
          npm rebuild --prefix tools/coinbase-embedded-wallet esbuild
          npm run check --prefix tools/coinbase-embedded-wallet
          npm run build --prefix tools/coinbase-embedded-wallet
          python scripts/test_configure_wallet_providers.py
          node --test scripts/test-wallet-link.js
          cd tools/coinbase-embedded-wallet
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Validate the reduced public site
        run: python scripts/check-site.py --require-wallet-bundle
      - name: Check retained browser JavaScript
        run: |
          node --check site/analytics-config.js
          node --check site/analytics.js
          node --check site/solarpunk-home.js
          node --check site/metrics.js
          node --check site/marketplace.js
          node --check site/competition.js
          node --check site/competition-proof.js
          node --check site/marketplace-workflow.js
          node --check site/webmcp.js
          node --check site/participate.js
          node --check site/phone-wallet.js
      - name: Test the living scene and marketplace evidence states
        run: node --test scripts/test-solarpunk-home.js
      - name: Test assistant desktop handoff and draft preservation
        run: node scripts/test-ai-bounty-handoff.js
      - name: Test the retained Metrics evidence engine
        run: node --test scripts/test-metrics-dashboard.js
      - name: Test unified marketplace readiness, timing, and economics
        run: node --test scripts/test-marketplace-ui.js scripts/test-webmcp.js scripts/test-meta-child.js scripts/test-competition-proof.js scripts/test-phone-wallet.js scripts/test-phone-wallet-network.cjs
      - name: Test posting and wallet actions in real browser viewports
        working-directory: tools/browser-layout
        run: |
          npm ci --ignore-scripts --no-fund
          npx playwright install --with-deps chromium
          npm test
      - name: Verify the privacy-safe GitHub participation aggregate
        run: |
          python scripts/test_github_audience_audit.py -v
          python scripts/github_audience_audit.py \
            --fixture scripts/fixtures/github_participation_metrics.json \
            --public-metrics-policy crates/api/fixtures/public-metrics-policy.json \
            --public-metrics-output /tmp/github-participation.json \
            --public-metrics-only
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path("/tmp/github-participation.json").read_text(encoding="utf-8"))
          assert value["schema_version"] == "agent-bounties/github-participation-v1"
          assert value["coverage"]["raw_identifiers_included"] is False
          assert set(value["periods"]) == {"7d", "28d", "90d", "lifetime"}
          PY
      - name: Verify optional analytics substitution
        env:
          GA_MEASUREMENT_ID: G-TEST123
        run: |
          cp site/analytics-config.js /tmp/analytics-config.js
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("/tmp/analytics-config.js")
          source = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'googleMeasurementId:\s*"(?:|G-[A-Z0-9]+)"',
              f'googleMeasurementId: "{os.environ["GA_MEASUREMENT_ID"]}"',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("analytics configuration assignment was not found exactly once")
          path.write_text(updated, encoding="utf-8")
          PY
          grep -q 'googleMeasurementId: "G-TEST123"' /tmp/analytics-config.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Build and configure account embedded-wallet creation
        env:
          COINBASE_CDP_PROJECT_ID: ${{ vars.COINBASE_CDP_PROJECT_ID }}
          COINBASE_WALLET_OUTDIR: site/vendor
        run: |
          npm ci --prefix tools/coinbase-embedded-wallet --ignore-scripts --no-audit --no-fund
          npm rebuild --prefix tools/coinbase-embedded-wallet esbuild
          npm run build --prefix tools/coinbase-embedded-wallet
          python scripts/configure-wallet-providers.py --verify-origin https://agentbounties.app
          test -s site/vendor/coinbase-embedded-wallet.bundle.js
          test -s site/vendor/coinbase-embedded-wallet.bundle.css
      - name: Configure phone-wallet pairing
        env:
          WALLETCONNECT_PROJECT_ID: ${{ vars.WALLETCONNECT_PROJECT_ID }}
        run: python scripts/configure-phone-wallet.py
      - name: Configure optional Google Analytics
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: |
          if [[ -n "${GA_MEASUREMENT_ID}" && ! "${GA_MEASUREMENT_ID}" =~ ^G-[A-Z0-9]+$ ]]; then
            echo "GA_MEASUREMENT_ID must match G-[A-Z0-9]+" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("site/analytics-config.js")
          source = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'googleMeasurementId:\s*"(?:|G-[A-Z0-9]+)"',
              f'googleMeasurementId: "{os.environ.get("GA_MEASUREMENT_ID", "")}"',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("analytics configuration assignment was not found exactly once")
          path.write_text(updated, encoding="utf-8")
          PY
      - name: Stage machine-readable protocol schemas
        run: |
          mkdir -p site/schemas
          cp schemas/discovery-manifest.v2.json site/schemas/discovery-manifest.v2.json
      - name: Generate privacy-safe GitHub participation metrics
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_TRAFFIC_TOKEN || github.token }}
        run: |
          python scripts/github_audience_audit.py \
            --repository "${GITHUB_REPOSITORY}" \
            --owner-login "${GITHUB_REPOSITORY_OWNER}" \
            --public-metrics-policy crates/api/fixtures/public-metrics-policy.json \
            --public-metrics-output site/generated/github-participation.json \
            --public-metrics-only
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify Home, unified marketplace, competition workspace, Metrics, legal pages, and discovery
        if: github.event_name != 'schedule'
        run: |
          set -euo pipefail
          nonce="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          curl --fail --silent --show-error --location "https://agentbounties.app/?verify=${nonce}" -o /tmp/live-index.html
          curl --fail --silent --show-error --location "https://agentbounties.app/earn.html?verify=${nonce}" -o /tmp/live-earn.html
          curl --fail --silent --show-error --location "https://agentbounties.app/competition.html?verify=${nonce}" -o /tmp/live-competition.html
          curl --fail --silent --show-error --location "https://agentbounties.app/metrics.html?verify=${nonce}" -o /tmp/live-metrics.html
          curl --fail --silent --show-error --location "https://agentbounties.app/privacy.html?verify=${nonce}" -o /tmp/live-privacy.html
          curl --fail --silent --show-error --location "https://agentbounties.app/terms.html?verify=${nonce}" -o /tmp/live-terms.html
          curl --fail --silent --show-error --location "https://agentbounties.app/.well-known/agent-bounties.json?verify=${nonce}" -o /tmp/live-discovery.json
          grep -q 'data-scene-root' /tmp/live-index.html
          grep -q 'Rather pay for results than tokens?' /tmp/live-index.html
          grep -q 'All ready opportunities' /tmp/live-earn.html
          grep -q 'Decision-grade economics' /tmp/live-competition.html
          grep -q 'id="payout-audit"' /tmp/live-metrics.html
          grep -q '<h1>Privacy policy</h1>' /tmp/live-privacy.html
          grep -q '<h1>Terms of use</h1>' /tmp/live-terms.html
          grep -q 'discovery-manifest.v2.json' /tmp/live-discovery.json
          phone_wallet_script="$(python -c 'import re; from pathlib import Path; print(re.search(r"phone-wallet\.js\?v=\d+", Path("site/index.html").read_text()).group(0))')"
          grep -Fq "${phone_wallet_script}" /tmp/live-index.html
          curl --fail --silent --show-error "https://agentbounties.app/phone-wallet-config.js?verify=${nonce}" -o /tmp/live-phone-wallet-config.js
          grep -Eq 'projectId: "[a-fA-F0-9]{32}"' /tmp/live-phone-wallet-config.js
          python scripts/check-public-handoffs.py --base-url https://agentbounties.app
          for route in objective.html funding.html; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://agentbounties.app/${route}?verify=${nonce}")"
            [[ "${status}" == "404" ]]
          done
