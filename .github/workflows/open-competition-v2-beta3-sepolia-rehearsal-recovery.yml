name: Open Competition V2 Beta3 Sepolia rehearsal recovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-competition-v2-beta3-sepolia-rehearsal-recovery
  cancel-in-progress: false

jobs:
  recover:
    environment: v2-beta2-sepolia
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Finalize and sweep exact failed-rehearsal actors
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
          BASE_SEPOLIA_RPC_URL: ${{ vars.BASE_SEPOLIA_RPC_URL }}
          BASE_SEPOLIA_DEPLOYER_PRIVATE_KEY: ${{ secrets.BASE_SEPOLIA_DEPLOYER_PRIVATE_KEY }}
          BASE_DEPLOYER_ADDRESS: ${{ vars.BASE_DEPLOYER_ADDRESS }}
        run: |
          set -euo pipefail
          test -n "$BASE_SEPOLIA_RPC_URL" && test -n "$BASE_SEPOLIA_DEPLOYER_PRIVATE_KEY"
          test "${BASE_DEPLOYER_ADDRESS,,}" = "0xfd7be4c69541ab297aece2a674fc1418b898cc0a"
          python -m pip install -r scripts/requirements-wallet.txt
          python scripts/test_recover_open_competition_v2_rehearsal_funds.py
          python scripts/recover_open_competition_v2_rehearsal_funds.py \
            --rpc-url "$BASE_SEPOLIA_RPC_URL" \
            --deployer "$BASE_DEPLOYER_ADDRESS" \
            --source-commit 4d09d82825c38f2bf93a8ee4375a95b302410c29 \
            --run-id 32147289466 \
            --attempt 1 --attempt 2 --attempt 3 --attempt 4 --attempt 5 --attempt 6 --attempt 7 --attempt 8 --attempt 9 --attempt 12 --attempt 14 \
            --additional-actor-scope b1ce5c176a3cf6d4e3d4240b0a2fdf1359a3a8c5:32122203861:1 \
            --additional-actor-scope 0bb9692d0804f72f7735fa5577ecb5c0340ee7b0:32563353721:5 \
            --competition 0x5e87358743dd4dcefc1a71ce9663ccf229ba7559 \
            --expired-competition 0x569fc0c653c81dfaca73467a7496c098a620f501 \
            --expired-competition 0x611aec6ef897f6cfe20afe70daabc4153b16435e \
            --funding-competition 0x702b2be0254b7a363d4bfb4e9b72d9424bbe4a8e \
            --funding-competition 0x23cec46243ad1b849086f3af78744bb2654e6800 \
            --required-actor 0xf723d4ac02331707f39bc9416b11ec25a73743f1 \
            --required-actor 0x300775bb9ae722e94280637c4547260f1708afc3 \
            --required-actor 0xfe9ba5613c36365fdeed32cbe92b2a644fa0f2a3 \
            --required-actor 0xdecc449c2af3ec13e348fc920451afa770eee2b5 \
            --required-actor 0xc4d6fa88149d31f6e5f8e46cd71f4c814ffe8526 \
            --required-actor 0xa62a0da47f22e85d688d101ecfc0220f338f5527 \
            --required-actor 0x3a9119736afe7f1d77d591540a3ca18c197f7df5 \
            --required-actor 0xfeddf1b81c5cdef4f749c71e67a19343e3ab3c55 \
            --required-actor 0x7fe6e588f8ef039d7e5ecb3ecc537145637b4437 \
            --required-actor 0xc93766c8037783663d0c88e54e1c09db206c41ed \
            --required-actor 0x54a188c7ef1e295b3e0f3fb2d33010b18679687b \
            --required-actor 0x6ab2e7d3f38236411c6d848dcd5cc8710efc359e \
            --required-actor 0xb2e54a743a1718f4a537aac8ca6ae68ceb20ac5a \
            --required-actor 0xa898d50b92e103abe626596b6b47d2ebfd506149 \
            --minimum-usdc 900000 \
            --output target/beta3-sepolia-rehearsal-recovery.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: open-competition-v2-beta3-sepolia-rehearsal-recovery-${{ github.sha }}-${{ github.run_attempt }}
          path: target/beta3-sepolia-rehearsal-recovery.json
          if-no-files-found: error
          retention-days: 365
