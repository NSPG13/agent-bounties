name: Public Runtime Release
on:
  workflow_run:
    workflows: ['CI', 'Containers']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      migrate_source:
        description: 'One-time move of the reviewed production service inventory to public main; preserves runtime settings'
        required: false
        default: false
        type: boolean
      bootstrap_autonomous_readers:
        description: 'Stage only autonomous readers; requires migrate_source and independent checkpoint acceptance before the full release'
        required: false
        default: false
        type: boolean
      approved_revision:
        description: 'Exact reviewed public-main SHA approved for this manual operation; preserves expected-live monitor values'
        required: false
        type: string
      accepted_autonomous_deploy_id:
        description: 'Exact independently accepted reader deployment ID to reuse during full promotion'
        required: false
        type: string
      bootstrap_repair_case:
        description: 'Exact reviewed expiring bootstrap incident; manual migration plus reader-only stage required'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: public-runtime-production
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'NSPG13/agent-bounties' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == 'NSPG13/agent-bounties'))
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check runtime release authority before loading deployment credentials
        id: authority
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.render_deploy_recovery import RecoveryError, enforce_public_runtime_release_authority

          try:
              enforce_public_runtime_release_authority()
          except RecoveryError as error:
              if str(error) != "public_runtime_transition_hold":
                  raise
              allowed = False
          else:
              allowed = True
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"allowed={str(allowed).lower()}\n")
          if not allowed:
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write("Broad public runtime release intentionally skipped: the public runtime transition hold is active. Replacement API releases use the dedicated main controller; readers remain held.\n")
          PY
      - name: Verify public-source release contracts
        if: steps.authority.outputs.allowed == 'true'
        run: |
          python3 scripts/test_deploy_public_runtime.py -v
          python3 scripts/test_bootstrap_repair_admission.py -v
          python3 scripts/test_public_runtime_parity.py -v
          python3 scripts/check_public_runtime_parity.py --published
      - name: Deploy exact public revision
        if: steps.authority.outputs.allowed == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          MIGRATE_SOURCE: ${{ inputs.migrate_source || false }}
          BOOTSTRAP_AUTONOMOUS_READERS: ${{ inputs.bootstrap_autonomous_readers || false }}
          TARGET_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
          PRODUCTION_EXPECTED_REVISION: ${{ vars.PRODUCTION_EXPECTED_REVISION }}
          APPROVED_REVISION: ${{ inputs.approved_revision }}
          RELEASE_EVENT: ${{ github.event_name }}
          ACCEPTED_AUTONOMOUS_DEPLOY_ID: ${{ inputs.accepted_autonomous_deploy_id }}
          BOOTSTRAP_REPAIR_CASE: ${{ inputs.bootstrap_repair_case }}
        run: |
          set -euo pipefail
          migration_args=()
          if [[ "${MIGRATE_SOURCE}" == 'true' ]]; then
            migration_args+=(--migrate-source)
          elif [[ "${MIGRATE_SOURCE}" != 'false' ]]; then
            exit 1
          fi
          if [[ "${BOOTSTRAP_AUTONOMOUS_READERS}" == 'true' ]]; then
            if [[ "${MIGRATE_SOURCE}" != 'true' ]]; then
              echo 'Reader bootstrap requires the explicit source migration operation.' >&2
              exit 1
            fi
            migration_args+=(--bootstrap-autonomous-readers)
          elif [[ "${BOOTSTRAP_AUTONOMOUS_READERS}" != 'false' ]]; then
            exit 1
          fi
          if [[ -n "${ACCEPTED_AUTONOMOUS_DEPLOY_ID}" ]]; then
            migration_args+=(--accepted-autonomous-deploy-id "$ACCEPTED_AUTONOMOUS_DEPLOY_ID")
          fi
          if [[ -n "${BOOTSTRAP_REPAIR_CASE}" ]]; then
            migration_args+=(--bootstrap-repair-case "$BOOTSTRAP_REPAIR_CASE")
          fi
          python3 scripts/deploy_public_runtime.py --revision "$TARGET_REVISION" \
            --evidence-dir target/operations/public-runtime-release "${migration_args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.authority.outputs.allowed == 'true'
        with:
          name: public-runtime-release-${{ github.run_id }}
          path: target/operations/public-runtime-release/
          if-no-files-found: warn
          retention-days: 90
