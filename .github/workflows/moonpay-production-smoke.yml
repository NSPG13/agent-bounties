name: MoonPay Production Smoke

on:
  push:
    branches:
      - maintainer/coinbase-embedded-wallet
  pull_request:
    paths:
      - ".github/workflows/moonpay-production-smoke.yml"
      - "scripts/check-moonpay-production.py"
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: moonpay-production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-coinbase-wallet:
    if: github.event_name == 'push' && github.ref == 'refs/heads/maintainer/coinbase-embedded-wallet' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: maintainer/coinbase-embedded-wallet

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Reassemble and apply fail-closed repository patch
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/bootstrap-coinbase-embedded-wallet.py.part-* > /tmp/bootstrap-coinbase-embedded-wallet.py
          python /tmp/bootstrap-coinbase-embedded-wallet.py

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/coinbase-embedded-wallet/package.json

      - name: Resolve and lock exact dependencies
        run: npm install --prefix tools/coinbase-embedded-wallet --ignore-scripts --no-audit --no-fund

      - name: Prepare reviewed esbuild binary
        run: npm rebuild --prefix tools/coinbase-embedded-wallet esbuild

      - name: Compile browser adapter
        run: npm run build --prefix tools/coinbase-embedded-wallet

      - name: Verify adapter, linking UI, x402 relay, and site
        run: |
          python scripts/check-coinbase-embedded-wallet.py
          python scripts/check-site.py
          node scripts/test-wallet-adapter-registry.js
          node scripts/test-x402-browser.js

      - name: Record dependency and bundle evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          lock_sha="$(sha256sum tools/coinbase-embedded-wallet/package-lock.json | awk '{print $1}')"
          js_sha="$(sha256sum site/coinbase-embedded-wallet.bundle.js | awk '{print $1}')"
          css_sha="$(sha256sum site/coinbase-embedded-wallet.bundle.css | awk '{print $1}')"
          js_bytes="$(wc -c < site/coinbase-embedded-wallet.bundle.js | tr -d ' ')"
          css_bytes="$(wc -c < site/coinbase-embedded-wallet.bundle.css | tr -d ' ')"
          {
            echo "lock_sha=${lock_sha}"
            echo "js_sha=${js_sha}"
            echo "css_sha=${css_sha}"
            echo "js_bytes=${js_bytes}"
            echo "css_bytes=${css_bytes}"
          } >> "$GITHUB_OUTPUT"

      - name: Commit generated lockfile, bundle, and integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "[coinbase-bootstrap] Add embedded wallet adapter and locked bundle"
          git push origin HEAD:maintainer/coinbase-embedded-wallet

      - name: Publish build evidence on the maintainer notice
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK_SHA: ${{ steps.evidence.outputs.lock_sha }}
          JS_SHA: ${{ steps.evidence.outputs.js_sha }}
          CSS_SHA: ${{ steps.evidence.outputs.css_sha }}
          JS_BYTES: ${{ steps.evidence.outputs.js_bytes }}
          CSS_BYTES: ${{ steps.evidence.outputs.css_bytes }}
        shell: bash
        run: |
          cat > /tmp/coinbase-wallet-evidence.md <<EOF
          ✅ **Coinbase embedded-wallet source, dependency lock, and browser bundle generated**

          - Node: 22
          - Coinbase SDK packages: exact 0.0.118 pins
          - Explicit authentication-method linking: compiled with Coinbase \`LinkAuth\`
          - Existing wallet choices: retained behind EIP-1193/EIP-6963
          - EOA funding path: exact EIP-3009 signature, x402 gas-only relay, canonical \`FundingAdded\`
          - User gas transaction in EOA funding path: none
          - package-lock SHA-256: \`${LOCK_SHA}\`
          - JS bundle: \`${JS_BYTES}\` bytes, SHA-256 \`${JS_SHA}\`
          - CSS bundle: \`${CSS_BYTES}\` bytes, SHA-256 \`${CSS_SHA}\`

          Deterministic adapter, x402, site, syntax, and generated-bundle checks passed. CDP project creation, production-domain allowlisting, and live authentication still require an authenticated CDP Portal session and are not represented by this build proof.
          EOF
          gh issue comment 604 --repo "$GITHUB_REPOSITORY" --body-file /tmp/coinbase-wallet-evidence.md

  verify-production:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify at least one active MoonPay on-ramp path
        id: availability
        continue-on-error: true
        run: |
          python scripts/check-moonpay-production.py \
            --output target/operations/moonpay-production-availability.json

      - name: Check server-signed partner activation
        id: activation
        continue-on-error: true
        run: |
          python scripts/check-moonpay-production.py \
            --require-checkout \
            --output target/operations/moonpay-production-activation.json

      - name: Publish redacted verification summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          availability_path = Path("target/operations/moonpay-production-availability.json")
          activation_path = Path("target/operations/moonpay-production-activation.json")
          if not availability_path.exists():
              summary.write_text(
                  "# MoonPay production smoke\n\nNo availability report was produced. Inspect the failed network step.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          availability = json.loads(availability_path.read_text(encoding="utf-8"))
          activation = (
              json.loads(activation_path.read_text(encoding="utf-8"))
              if activation_path.exists()
              else availability
          )
          endpoint = availability.get("endpoint") or activation.get("endpoint") or {}
          active_paths = availability.get("active_paths") or {}
          direct = availability.get("direct_fallback") or {}
          static = availability.get("static") or []
          lines = [
              "# MoonPay production smoke",
              "",
              f"- On-ramp available: `{str(availability.get('success')).lower()}`",
              f"- Static assets verified: `{len(static)}/4`",
              f"- Direct consumer fallback active: `{str(active_paths.get('direct_consumer')).lower()}`",
              f"- Server-signed partner checkout active: `{str(active_paths.get('signed_partner')).lower()}`",
              f"- Partner activation state: `{endpoint.get('activation_state', 'unavailable')}`",
              f"- Endpoint HTTP status: `{endpoint.get('status', 'unavailable')}`",
              f"- Provider code: `{endpoint.get('code') or 'none'}`",
              f"- Direct fallback wallet-prefilled: `{str(direct.get('wallet_prefilled')).lower()}`",
              f"- Bounty funded by this check: `{str(endpoint.get('bounty_funded', direct.get('bounty_funded'))).lower()}`",
              f"- Canonical funding event: `{endpoint.get('canonical_funding_event') or direct.get('canonical_funding_event') or 'none'}`",
              "",
              "This canary never opens checkout, makes a purchase, signs a wallet transaction, or funds a bounty. The direct path requires the user to copy and verify the wallet and Base asset inside MoonPay.",
          ]
          if availability.get("error"):
              lines.extend(["", f"Availability failure: `{availability['error']}`"])
          if activation.get("failure"):
              lines.extend(["", f"Partner activation blocker: `{activation['failure']}`"])
          if endpoint.get("error"):
              lines.extend(["", f"Provider configuration detail: `{endpoint['error']}`"])
          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload redacted MoonPay production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonpay-production-${{ github.run_id }}
          path: target/operations/moonpay-production-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce an active MoonPay on-ramp path
        if: always() && steps.availability.outcome != 'success'
        run: |
          echo "Neither the signed MoonPay checkout nor the direct consumer fallback is working in production." >&2
          exit 1
