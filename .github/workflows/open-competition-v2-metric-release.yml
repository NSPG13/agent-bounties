name: Open Competition V2 metric release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/open-competition-v2-metric-release.yml"
      - "crates/competition-metric-core/**"
      - "programs/public-vector-metric-v1/**"
      - "scripts/verify-open-competition-v2-metric-release.py"
      - "scripts/verify_sp1_patched_graph.py"

permissions:
  contents: read

env:
  SP1_SAFE_REPOSITORY: https://github.com/NSPG13/sp1
  SP1_SAFE_COMMIT: 0b729d415bf024ae425b27e6a829bed7642bbe7f

jobs:
  isolated-build:
    name: Isolated SP1 build ${{ matrix.builder }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        builder: [a, b]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: dtolnay/rust-toolchain@858a1ecb106d4516018578006590eb829de1f08e
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          version: "28.3"
      - name: Install the patched source-pinned SP1 toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://sp1.succinct.xyz -o /tmp/sp1up-install.sh
          echo "5f2b976287501d3f5feb62a2a96bbdfd1f5232c9badaf7547ed837c0366f3a7b  /tmp/sp1up-install.sh" | sha256sum -c -
          bash /tmp/sp1up-install.sh
          "$HOME/.sp1/bin/sp1up" -v 6.4.0
          git clone --filter=blob:none "$SP1_SAFE_REPOSITORY" /tmp/agent-bounties-sp1-safe
          git -C /tmp/agent-bounties-sp1-safe checkout --detach "$SP1_SAFE_COMMIT"
          test "$(git -C /tmp/agent-bounties-sp1-safe rev-parse HEAD)" = "$SP1_SAFE_COMMIT"
          cargo install --locked --force --root "$HOME/.sp1" \
            --path /tmp/agent-bounties-sp1-safe/crates/cli
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
          "$HOME/.sp1/bin/cargo-prove" prove --version | grep -F '0b729d4'
      - name: Build and execute public vector guest
        working-directory: programs/public-vector-metric-v1
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          expected_rust="$(python -c 'import json; print(json.load(open("release-identity.json"))["rust_version"])')"
          test "$(rustc --version | awk '{print $2}')" = "$expected_rust"
          python ../../scripts/verify_sp1_patched_graph.py
          test "$(cargo tree --locked -p public-vector-metric-v1-script --prefix none | grep '^p3-challenger ' | sort -u | wc -l)" = 1
          cargo tree --locked -p public-vector-metric-v1-script --prefix none \
            | grep '^p3-challenger ' | grep -F "$SP1_SAFE_REPOSITORY?rev=$SP1_SAFE_COMMIT"
          {
            cargo prove --version
            cargo run --locked --release -p public-vector-metric-v1-script -- \
              fixtures/golden-v1.json execute
          } | tee "evidence-${{ matrix.builder }}.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metric-evidence-${{ matrix.builder }}
          path: programs/public-vector-metric-v1/evidence-${{ matrix.builder }}.jsonl
          if-no-files-found: error
          retention-days: 30

  compare:
    name: Compare isolated release evidence
    needs: isolated-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: metric-evidence-*
          path: evidence
          merge-multiple: true
      - name: Verify exact build and journal bindings
        run: |
          set -euo pipefail
          python scripts/verify-open-competition-v2-metric-release.py \
            --first evidence/evidence-a.jsonl \
            --second evidence/evidence-b.jsonl \
            --output release/public-vector-metric-v1.json
      - name: Run adversarial metric corpus
        run: cargo test --locked -p competition-metric-core
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-vector-metric-v1-reviewed-release
          path: release/public-vector-metric-v1.json
          if-no-files-found: error
          retention-days: 90
