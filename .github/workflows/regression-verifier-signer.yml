name: Regression Verifier Signer

on:
  pull_request:
    paths:
      - "scripts/verifier_release.py"
      - "scripts/test_verifier_release.py"
      - "scripts/gas_sponsorship_budget.py"
      - "scripts/test_gas_sponsorship_budget.py"
      - ".cargo/**"
      - ".github/workflows/regression-verifier-runner.yml"
      - ".github/workflows/regression-verifier-signer.yml"
      - ".github/workflows/regression-verifier-signing-reusable.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "bounties/**"
      - "crates/**"
      - "contracts/base-escrow/fixtures/**"
      - "migrations/**"
      - "ops/**"
      - "programs/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "schemas/**"
      - "scripts/regression_verifier_pipeline.py"
      - "scripts/regression_verifier_source_guard.py"
      - "scripts/test_regression_verifier_pipeline.py"
      - "scripts/test_regression_verifier_source_guard.py"
      - "site/**"
  workflow_run:
    workflows: ["Regression Verifier Runner"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/test_gas_sponsorship_budget.py -v
      - run: python scripts/test_regression_verifier_pipeline.py -v
      - run: python scripts/test_regression_verifier_source_guard.py -v

  authorize-run:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.REGRESSION_VERIFIER_RELEASE_JSON != '' && vars.REGRESSION_WORKER_URL != ''
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.main.outputs.authorized }}
      revision: ${{ steps.main.outputs.revision }}
      run_id: ${{ steps.main.outputs.run_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
        with:
          ref: ${{ fromJSON(vars.REGRESSION_VERIFIER_RELEASE_JSON).source_revision }}
      - name: Load approved release identity
        env:
          REGRESSION_VERIFIER_RELEASE_JSON: ${{ vars.REGRESSION_VERIFIER_RELEASE_JSON }}
        run: |
          mkdir -p target
          python -c 'import os,pathlib; pathlib.Path("target/verifier-release.json").write_text(os.environ["REGRESSION_VERIFIER_RELEASE_JSON"])'
      - uses: actions/download-artifact@v8
        with:
          name: regression-candidates-${{ github.event.workflow_run.id }}
          path: target/regression-candidates
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - id: main
        env:
          CANDIDATE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          python scripts/verifier_release.py authorize --manifest target/verifier-release.json
          --candidates target/regression-candidates --run-id "$CANDIDATE_RUN_ID"

  sign-one:
    if: needs.authorize-run.outputs.authorized == 'true'
    needs: authorize-run
    uses: ./.github/workflows/regression-verifier-signing-reusable.yml
    with:
      revision: ${{ needs.authorize-run.outputs.revision }}
      candidate_run_id: ${{ needs.authorize-run.outputs.run_id }}
      signer_slot: one
      expected_signer: ${{ vars.REGRESSION_VERIFIER_ONE_ADDRESS }}
    secrets:
      verifier_private_key: ${{ secrets.REGRESSION_VERIFIER_ONE_PRIVATE_KEY }}
      checkpoint_token: ${{ secrets.REGRESSION_SIGNER_ONE_CHECKPOINT_TOKEN }}

  sign-two:
    if: needs.authorize-run.outputs.authorized == 'true'
    needs: authorize-run
    uses: ./.github/workflows/regression-verifier-signing-reusable.yml
    with:
      revision: ${{ needs.authorize-run.outputs.revision }}
      candidate_run_id: ${{ needs.authorize-run.outputs.run_id }}
      signer_slot: two
      expected_signer: ${{ vars.REGRESSION_VERIFIER_TWO_ADDRESS }}
    secrets:
      verifier_private_key: ${{ secrets.REGRESSION_VERIFIER_TWO_PRIVATE_KEY }}
      checkpoint_token: ${{ secrets.REGRESSION_SIGNER_TWO_CHECKPOINT_TOKEN }}

  relay:
    if: needs.authorize-run.outputs.authorized == 'true'
    needs: [authorize-run, sign-one, sign-two]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: agent-bounties-shared-base-keeper
      cancel-in-progress: false
    env:
      API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL || 'https://api.agentbounties.app' }}
      BASE_MAINNET_RPC_URL: ${{ vars.REGRESSION_VERIFIER_RPC_URL || 'https://mainnet.base.org' }}
      KEEPER_ADDRESS: "0xc26a630e85134ed30968735c8e7de4576cfa5dbc"
      VERIFIER_ONE: ${{ vars.REGRESSION_VERIFIER_ONE_ADDRESS }}
      VERIFIER_TWO: ${{ vars.REGRESSION_VERIFIER_TWO_ADDRESS }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
        with:
          ref: ${{ needs.authorize-run.outputs.revision }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
      - uses: actions/download-artifact@v8
        with:
          name: regression-candidates-${{ needs.authorize-run.outputs.run_id }}
          path: target/regression-candidates
          github-token: ${{ github.token }}
          run-id: ${{ needs.authorize-run.outputs.run_id }}
      - uses: actions/download-artifact@v8
        with:
          name: regression-attestations-one
          path: target/attestations-one
      - uses: actions/download-artifact@v8
        with:
          name: regression-attestations-two
          path: target/attestations-two
      - name: Load approved release identity
        env:
          REGRESSION_VERIFIER_RELEASE_JSON: ${{ vars.REGRESSION_VERIFIER_RELEASE_JSON }}
        run: |
          mkdir -p target
          python -c 'import os,pathlib; pathlib.Path("target/verifier-release.json").write_text(os.environ["REGRESSION_VERIFIER_RELEASE_JSON"])'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/release/worker
          key: reviewed-verifier-${{ runner.os }}-${{ runner.arch }}-${{ fromJSON(vars.REGRESSION_VERIFIER_RELEASE_JSON).worker_binary_digest }}
      - name: Verify exact reviewed source and cached or downloaded binary
        env:
          REGRESSION_WORKER_URL: ${{ vars.REGRESSION_WORKER_URL }}
        run: >-
          python scripts/verifier_release.py fetch
          --manifest target/verifier-release.json
          --worker target/release/worker
          --download-url "$REGRESSION_WORKER_URL"
      - name: Check candidate release before keeper access
        run: >-
          python scripts/verifier_release.py authorize --manifest target/verifier-release.json
          --candidates target/regression-candidates --run-id "${{ needs.authorize-run.outputs.run_id }}"
      - name: Revalidate and relay exact quorum
        env:
          BASE_KEEPER_PRIVATE_KEY: ${{ secrets.BASE_KEEPER_PRIVATE_KEY }}
          GAS_SPONSOR_BUDGET_TOKEN: ${{ secrets.GAS_SPONSOR_BUDGET_TOKEN }}
        run: >-
          python scripts/regression_verifier_pipeline.py relay
          --api-base "$API_BASE_URL"
          --network base-mainnet
          --rpc-url "$BASE_MAINNET_RPC_URL"
          --candidates target/regression-candidates
          --attestations target/attestations-one
          --attestations target/attestations-two
          --verifier "$VERIFIER_ONE"
          --verifier "$VERIFIER_TWO"
          --worker target/release/worker
          --expected-keeper "$KEEPER_ADDRESS"
