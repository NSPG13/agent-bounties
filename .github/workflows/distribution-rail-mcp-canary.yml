name: Distribution rail MCP dry-run canary

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-rail-mcp-dry-run-production
  cancel-in-progress: true

jobs:
  verify-production-rails:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Run three read-only production rail matrices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/distribution
          {
            echo "Agent Bounties production distribution-rail MCP dry run"
            echo "observed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "revision=${GITHUB_SHA}"
            echo "endpoint=https://mcp.agentbounties.app"
            echo "scope=initialize,tools/list; analytics-only acquisition records; no product or wallet action"
            echo "evidence_boundary=dry-run only; never a substitute for the required excluded-operator 2-USDC funded-and-settled mainnet canary"
            python scripts/check-distribution-rail-mcp.py \
              --endpoint https://mcp.agentbounties.app \
              --repetitions 3
          } 2>&1 | tee target/distribution/production-rail-mcp-dry-run.txt

      - name: Retain production rail dry-run evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: distribution-rail-mcp-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/distribution/production-rail-mcp-dry-run.txt
          if-no-files-found: error
          retention-days: 30
