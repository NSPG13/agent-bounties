name: Regression Verifier Signing Slot

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      candidate_run_id:
        required: true
        type: string
      signer_slot:
        required: true
        type: string
      expected_signer:
        required: true
        type: string
    secrets:
      verifier_private_key:
        required: true
      checkpoint_token:
        required: true

permissions:
  actions: read
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL || 'https://api.agentbounties.app' }}
      BASE_MAINNET_RPC_URL: ${{ vars.REGRESSION_VERIFIER_RPC_URL || 'https://mainnet.base.org' }}
    steps:
      # Only protected workflow code may decide which release code can run.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: provenance
        name: Authorize protected release before selected source or credentials
        env:
          REGRESSION_VERIFIER_RELEASE_JSON: ${{ vars.REGRESSION_VERIFIER_RELEASE_JSON }}
          EXPECTED_RELEASE_REVISION: ${{ inputs.revision }}
        run: python3 -I scripts/verifier_release_provenance.py
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
        with:
          ref: ${{ steps.provenance.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
      - uses: actions/download-artifact@v8
        with:
          name: regression-candidates-${{ inputs.candidate_run_id }}
          path: target/regression-candidates
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Load approved release identity
        env:
          REGRESSION_VERIFIER_RELEASE_JSON: ${{ vars.REGRESSION_VERIFIER_RELEASE_JSON }}
        run: |
          mkdir -p target
          python -c 'import os,pathlib; pathlib.Path("target/verifier-release.json").write_text(os.environ["REGRESSION_VERIFIER_RELEASE_JSON"])'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/release/worker
          key: reviewed-verifier-${{ runner.os }}-${{ runner.arch }}-${{ fromJSON(vars.REGRESSION_VERIFIER_RELEASE_JSON).worker_binary_digest }}
      - name: Verify exact reviewed source and cached or downloaded binary
        env:
          REGRESSION_WORKER_URL: ${{ vars.REGRESSION_WORKER_URL }}
        run: >-
          python scripts/verifier_release.py fetch
          --manifest target/verifier-release.json
          --worker target/release/worker
          --download-url "$REGRESSION_WORKER_URL"
      - name: Bind candidate release before granting signer access
        run: >-
          python scripts/verifier_release.py authorize --manifest target/verifier-release.json
          --candidates target/regression-candidates --run-id "${{ inputs.candidate_run_id }}"
      - name: Check this isolated signer
        env:
          REGRESSION_VERIFIER_PRIVATE_KEY: ${{ secrets.verifier_private_key }}
          REGRESSION_CHECKPOINT_TOKEN: ${{ secrets.checkpoint_token }}
        run: >-
          python scripts/verifier_release.py diagnose --manifest target/verifier-release.json
          --worker target/release/worker --component "signer:${{ inputs.expected_signer }}"
          --api-base "$API_BASE_URL" --health-result target/signer-health.json
      - name: Re-fetch state and sign one exact candidate set
        env:
          REGRESSION_VERIFIER_PRIVATE_KEY: ${{ secrets.verifier_private_key }}
        run: >-
          python scripts/regression_verifier_pipeline.py sign
          --api-base "$API_BASE_URL"
          --network base-mainnet
          --rpc-url "$BASE_MAINNET_RPC_URL"
          --candidates target/regression-candidates
          --output "target/attestations-${{ inputs.signer_slot }}"
          --worker target/release/worker
          --private-key-env REGRESSION_VERIFIER_PRIVATE_KEY
          --expected-signer "${{ inputs.expected_signer }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: regression-attestations-${{ inputs.signer_slot }}
          path: target/attestations-${{ inputs.signer_slot }}
          if-no-files-found: error
          retention-days: 7
