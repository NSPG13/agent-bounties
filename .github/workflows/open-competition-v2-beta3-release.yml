              "passed": True,
              "competition_escrow_funded_base_units": 525000,
              "groth16_solver_reward_base_units": 250000,
              "plonk_solver_reward_base_units": 250000,
              "keeper_rewards_base_units": 25000,
              "x402_success": success,
              "x402_refund": refund,
              "plonk": canaries["plonk_best_score"],
          }, open("target/mainnet-accounting.json", "w"), indent=2)
          PY
          cp target/production-control-plane/release-gates.json target/release-gates.json
          evidence_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python scripts/record_open_competition_v2_beta3_gate.py --manifest target/release-gates.json \
            --gate broker_refund_reserve_ready --evidence target/mainnet-broker-reserve-after.json \
            --uri "$evidence_uri" --source-commit "$GITHUB_SHA"
          python scripts/record_open_competition_v2_beta3_gate.py --manifest target/release-gates.json \
            --gate mainnet_groth16_canary_complete --evidence target/mainnet-x402-success.json \
