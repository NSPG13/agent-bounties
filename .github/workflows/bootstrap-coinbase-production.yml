name: Diagnose Coinbase Production

on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap-coinbase-production.yml"
  push:
    branches: [maintainer/coinbase-embedded-wallet]
    paths:
      - ".github/workflows/bootstrap-coinbase-production.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: diagnose-coinbase-production-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COINBASE_CDP_PROJECT_ID: 9dfed88a-0b37-47e8-b867-96f1dfd0d4ee
      PRODUCTION_ORIGIN: https://agentbounties.app
      MAINTAINER_NOTICE: "604"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/coinbase-embedded-wallet/package-lock.json

      - name: Install the exact reviewed Coinbase dependency graph
        run: npm ci --prefix tools/coinbase-embedded-wallet --ignore-scripts --no-audit --no-fund

      - name: Prove canonical production project configuration
        run: |
          set -euo pipefail
          cp -R site /tmp/coinbase-site
          env -u COINBASE_CDP_PROJECT_ID \
            GITHUB_ACTIONS=true \
            GITHUB_REPOSITORY=NSPG13/agent-bounties \
            python scripts/configure-wallet-providers.py --site-root /tmp/coinbase-site
          grep -q '9dfed88a-0b37-47e8-b867-96f1dfd0d4ee' /tmp/coinbase-site/wallet-config.js
          ! grep -q '__COINBASE_CDP_PROJECT_ID__' /tmp/coinbase-site/wallet-config.js
          echo "Canonical Pages configuration resolves project 9dfe…d4ee without a repository secret."

      - name: Trace endpoints used by the locked Coinbase browser SDK
        id: trace
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          roots = [
              Path("tools/coinbase-embedded-wallet/node_modules/@coinbase"),
              Path("site/coinbase-embedded-wallet.bundle.js"),
          ]
          url_pattern = re.compile(r"https://[A-Za-z0-9._~:/?#\[\]@!$&'()*+,;=%{}-]+")
          path_pattern = re.compile(r"[A-Za-z0-9_./{}-]*(?:embedded[-_/ ]?wallet|project|origin|allowlist|auth)[A-Za-z0-9_./{}?=&%-]*", re.I)
          urls = set()
          paths = set()
          scanned = 0
          for root in roots:
              files = [root] if root.is_file() else list(root.rglob("*"))
              for path in files:
                  if not path.is_file() or path.stat().st_size > 8_000_000:
                      continue
                  try:
                      text = path.read_text(encoding="utf-8", errors="ignore")
                  except OSError:
                      continue
                  scanned += 1
                  for value in url_pattern.findall(text):
                      if "coinbase" in value.lower() or "cdp" in value.lower():
                          urls.add(value.rstrip("'\"`),.;"))
                  for value in path_pattern.findall(text):
                      normalized = value.strip("'\"`),.;")
                      if len(normalized) >= 8:
                          paths.add(normalized)
          report = {
              "schema_version": "agent-bounties/coinbase-sdk-endpoint-trace-v1",
              "scanned_files": scanned,
              "urls": sorted(urls),
              "candidate_paths": sorted(paths)[:300],
          }
          Path("/tmp/coinbase-sdk-endpoints.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY

      - name: Publish redacted diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("/tmp/coinbase-sdk-endpoints.json")
          report = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {"urls": [], "candidate_paths": []}
          urls = "\n".join(f"- `{value}`" for value in report.get("urls", [])[:40]) or "- No literal Coinbase URL found; runtime composition requires a browser trace."
          paths = "\n".join(f"- `{value}`" for value in report.get("candidate_paths", [])[:40]) or "- No candidate path found."
          body = f"""## Coinbase locked-SDK endpoint trace

          The canonical Pages build resolves the supplied public project as `9dfe…d4ee`; no Coinbase API secret is stored.

          Literal Coinbase/CDP URLs in the locked SDK:
          {urls}

          Candidate runtime paths:
          {paths}

          Run: ${{{{ github.server_url }}}}/${{{{ github.repository }}}/actions/runs/${{{{ github.run_id }}}}
          """
          Path("/tmp/coinbase-diagnostic.md").write_text(body, encoding="utf-8")
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${MAINTAINER_NOTICE}/comments" \
            --raw-field body="$(cat /tmp/coinbase-diagnostic.md)" >/dev/null
