name: Check Pinned Revision

on:
  schedule:
    - cron: "13 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check pinned revision
        id: check
        run: |
          pin="${{ vars.PRODUCTION_EXPECTED_REVISION }}"
          if [[ -z "$pin" ]]; then
            echo "No pinned revision. Workflow default (github.sha) applies."
            exit 0
          fi

          # Check if pin is an ancestor of main
          if ! git merge-base --is-ancestor "$pin" HEAD; then
            echo "pin_orphaned=true" >> "$GITHUB_OUTPUT"
            echo "pin=$pin" >> "$GITHUB_OUTPUT"
            echo "::warning::Pinned SHA $pin is not an ancestor of main. Update or remove the pin."
            exit 0
          fi

          # Check if pin is older than 7 days
          pin_date=$(git log -1 --format=%ct "$pin" 2>/dev/null || echo "0")
          now=$(date +%s)
          age_days=$(( (now - pin_date) / 86400 ))
          if [[ $age_days -gt 7 ]]; then
            echo "pin_stale=true" >> "$GITHUB_OUTPUT"
            echo "pin=$pin" >> "$GITHUB_OUTPUT"
            echo "age_days=$age_days" >> "$GITHUB_OUTPUT"
            echo "::warning::Pinned SHA $pin is $age_days days old. Update or remove the pin."
          fi

      - name: Open warning issue
        if: steps.check.outputs.pin_orphaned == 'true' || steps.check.outputs.pin_stale == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pin = steps.check.outputs.pin;
            const ageDays = steps.check.outputs.age_days;
            const title = `Pinned revision ${pin} needs attention`;
            const body = `The \`PRODUCTION_EXPECTED_REVISION\` repository variable points to ${pin}, which is ${steps.check.outputs.pin_orphaned === 'true' ? '**not an ancestor of main**' : `**${ageDays} days old**`}.

            Update the variable to the currently deployed SHA, or remove it to fall back to \`github.sha\`.

            See [ops/release-runbook.md](https://github.com/NSPG13/agent-bounties/blob/main/ops/release-runbook.md) for instructions.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['operational', 'maintainer-notice'],
            });
