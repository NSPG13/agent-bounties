[workspace]
resolver = "2"
members = ["script"]
exclude = ["program"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
competition-metric-core = { path = "../../crates/competition-metric-core" }
serde_json = "1"
sha2 = "0.10"
sp1-build = { git = "https://github.com/succinctlabs/sp1", rev = "d454975ac7c1126097e36eceda9bce2cb9899da4" }
sp1-sdk = { git = "https://github.com/succinctlabs/sp1", rev = "d454975ac7c1126097e36eceda9bce2cb9899da4" }
tiny-keccak = { version = "2", features = ["keccak"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
