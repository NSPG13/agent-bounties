[workspace]
resolver = "2"
members = ["script"]
exclude = ["program"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
competition-metric-core = { path = "../../crates/competition-metric-core" }
serde_json = "1"
sha2 = "0.10"
sp1-build = { git = "https://github.com/succinctlabs/sp1", rev = "8252c2905ce32964df68248117015c61ebb854db" }
sp1-sdk = { git = "https://github.com/succinctlabs/sp1", rev = "8252c2905ce32964df68248117015c61ebb854db" }
tiny-keccak = { version = "2", features = ["keccak"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
